# Отраслевая надстройка миров семейства (рост сектора по группам кредитов и средств клиентов; один у банков семейства) —
# копия листа сектора версии миров из общего источника (versions/<v>/bank/sector_sheet.yaml); тело пишет команда
# приёма миров (ops/tools/adopt_worlds.py), руками не править. build_overlay.py читает meta и sector; прочие блоки
# листа (если есть) — справка, книга Т-Технологий их не читает.
