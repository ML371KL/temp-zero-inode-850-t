# ------------------------------------------------------------------ КОРИДОРЫ ГЕЙТОВ И ДОПУСКИ ИНВАРИАНТОВ (MODEL §14) — стартовые; после первого счёта ядра
#                                                                    проверить, что центральная книга проходит
checks:
  ddm_ri_tol: 0.001                                            # инвариант ddm_equals_ri: |V_DDM − V_RI| / V_RI в клетке
  transmission_tol: 1.0e-9                                     # инвариант transmission_solved: |стационарная маржа мира уровня − ключ цели| и |T_real − T*| (реализованная передача)
  exdate_jump_tol: 0.01                                        # инвариант exdate_jump: скачок на экс-дату = −DPS × акции в обращении / делитель ± 1 % (−4,467 ₽ для 4,70 ₽)
  pb_by_world: {N: [0.4, 2.5], H: [0.4, 2.5], M: [0.4, 2.5]}   # V/BV клетки по мирам [В: коридор Т: при ROE фазы роста 25–29 % лучшие клетки стоят больше двух капиталов]
  roe_range: [-0.05, 0.36]                                     # ROE года: операционная прибыль к капиталу акционеров МСФО; факт кварталов 26,7–33,3 % [В]
  cor_range: [0.03, 0.12]                                      # CoR года, базис движка: пути режимов 4,0–10,0 % упр. минус мост около 0,25 п.п. [В]
  nim_range: [0.08, 0.13]                                      # ЧПМ квартала, упр. базис (через мост): кварталы 2024–2026 годов 10,0–12,2 % [В]
  cir_range: [0.40, 0.58]                                      # C/I года, базис движка: цель 48,6 %; история 46,4–53,6 % [В]
  roe_k_spread: {range: [-0.10, 0.10], max_world_gap: 0.08}    # ROE'_T − k_T клетки и разрыв средних по мирам: при малой передаче разрыв миров — свойство книги
                                                               #   [В]; числа миров печатает сообщение гейта
  terminal_share: [0.15, 0.65]                                 # доля PV терминала в V (DDM) [В: как в моделях семейства]
  real_rate: [0.02, 0.13]                                      # реальная ставка мира в терминале [В: как в моделях семейства]
  bridge_drift_pp: {cor: 0.002, nim: 0.003}                    # A-X4: дрейф моста упр. ↔ движок, доли: ≈2,5σ; у ЧПМ — с рябью счёта дней 0,11 п.п. [Р: evidence/pnl]
  nim_path_joint: {quarters: 8, tolerance: 0.003}              # A-X7: ЧПМ упр. первых 8 прогнозных кварталов ≤ max(ЧПМ якоря, Nss мира) + 0,3 п.п.: ступени ЧПМ в 2027 году нет
  transmission_pairs: [-0.20, 0.30]                            # A-X7: парные передачи соседних миров (N→H, H→M) [Р: evidence/nii]; значения центра печатает сообщение гейта
  lt_spread_floor: {cards: 0.095, cash_loans: 0.075, auto: 0.025, mortgage: 0.005, sme_loans: 0.155, corp_loans: 0.0}
                                                               # A-X8: пол эффективного LT-спреда кредитной книги к её опоре в стационаре мира: меньшее из стоимости риска продукта
                                                               #   за окно и минимума спреда окна с лагом [Р/В: evidence/nii]; гейт проверяет центральную книгу, нарушение на
                                                               #   краях осей ЧПМ и передачи — ограничение книги
  ni_jump: {quarters: 8, yoy: 0.40, key_tol: 0.01}             # A-X7: флаг — операционная прибыль квартала г/г > +40 % при ключевой ±1 п.п. к тому же кварталу: норма роста
                                                               #   компании 20–30 % [В]
  m_crisis_vs_cbr:                                             # A-X5: «M × кризис» против рискового сценария Банка России [Ф: «Основные направления», табл. 3.5]
    loan_growth: {"2027": [0.0, 0.05], "2028": [0.02, 0.07]}
    cor_shock_year: 0.095                                      # CoR года шока (упр. базис) не ниже: путь кризиса — 10,0 % в 2027 году [В]
