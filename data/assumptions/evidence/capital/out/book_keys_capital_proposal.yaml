# Предложение ключей книги Т 1.0: капитал, нормативы, RWA, ограничение роста (этап 1б, ключ calib-capital, 07.10.2026).
# Собрано make_keys.py из расчётов листа (руками не править). Форма - data/assumptions/assumptions_template.yaml Сбера.
# Класс: A - факт или расчёт по раскрытому; B - расчёт с суждением о составе; C - суждение. Ось - для unc.axes.
# Слоты ядра: n20_0 - Н20.0 банковской группы; n1_1 (n11) - Н20.1 банковской группы (оба - факт ЦБ, ф. 0409805).

joint:
  reg_prob_given_regime:                                 # P(сценарий капитала | режим) [В: LEAD-2 §7 п. 5; опоры в данных нет] класс C
    soft:     {schedule: 0.35, mid: 0.45, strict: 0.20}
    norm:     {schedule: 0.35, mid: 0.45, strict: 0.20}
    downturn: {schedule: 0.35, mid: 0.45, strict: 0.20}
    crisis:   {schedule: 0.70, mid: 0.25, strict: 0.05}     # в кризисе антициклическая надбавка и макронадбавки распускаются

oci:
  fvoci_share: anchor                                    # (долговые FVOCI 333,0 + в репо 13,9) / книга securities 745,8 = 0.465 [Р: МСФО 6М26 с. 37-38] класс A
  fvoci_duration: 1.5                                    # эффективная дюрация к ОФЗ 3 г., лет [Р/В: 2,1 по трём кварталам из четырёх, 0,8-1,4 по году 2025]; ось 0,7-2,3; класс C
  fvoci_maturity: 3.0                                    # срок подтягивания к номиналу, лет [В: сроки бумаг не раскрыты]; ось 2-5; класс C
  fvoci_tenor: ofz_3y                                    # узел кривой мира [Р: к ОФЗ 3 г. оценка устойчивее, чем к 5 л.]; класс B
  fvtpl_bond_share: anchor                               # облигации по СС / книга securities: (ОФЗ + корпоративные FVTPL) / 745,8 [Р: МСФО 6М26 с. 38]
  fvtpl_bond_duration: null                              # не читается при other.fvtpl_bond_reval: false [нераскрыто]

capital:
  minimum: {n20_0: 0.08, n1_1: 0.045}                    # минимум Н20.0 и Н20.1 группы [Ф: 220-И п. 2.2; 729-П] класс A
  mgmt_buffer: {n20_0: 0.015, n1_1: 0.015}               # запас менеджмента над минимумом сценария [В: LEAD-2 §7 п. 3] класс C; ось 0,5-3,0 п.п. (обе вместе)
                                                         #   ряд ф. 0409805 после Росбанка: 2,6-3,2 (Н20.0) и 2,7-3,8 (Н20.1) к действующему минимуму;
                                                         #   -0,4…+1,0 и -0,1…+1,2 к минимуму 2028 года (12,0 / 8,5); 2019-2021: 1,4-4,3 и 1,25-3,9 к полному минимуму
                                                         #   порог: при запасе выше 1,93 п.п. требование с глиссадой уже на якоре выше факта в «средней группе»
  reg_scenarios:                                         # надбавки по годам (с 1 января), доли RWA [Ф: 220-И пп. 3.2-3.4; В: 2028+] - stage1/regulation/schedule.yaml
    ids: [schedule, mid, strict]
    schedule:
      name: "По графику"
      conservation: {"2026": 0.01, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.01}
      ccyb: {LT: 0.005}
      deduction_pp:
        n20_0: {LT: 0}
        n1_1: {LT: 0}
    mid:
      name: "Средняя группа СЗКО"
      conservation: {"2026": 0.01, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.01, "2029": 0.015}
      ccyb: {"2026": 0.005, "2027": 0.005, "2028": 0.01}
      deduction_pp:
        n20_0: {LT: 0}
        n1_1: {LT: 0}
    strict:
      name: "Жёсткий"
      conservation: {"2026": 0.01, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.01, "2029": 0.015, "2030": 0.02}
      ccyb: {"2026": 0.005, "2027": 0.005, "2028": 0.01}
      deduction_pp:
        n20_0: {"2026": 0, "2027": 0, "2028": 0.003}
        n1_1: {"2026": 0, "2027": 0, "2028": 0.003}
    # Пол Н20.0 = 8 % + надбавки: 10,0 (2026) -> 10,75 (2027) -> 12,0 / 12,5 / 12,5 (2028) -> 12,0 / 13,0 / 13,0 (2029) -> 12,0 / 13,0 / 13,5 (2030+);
    #   пол Н20.1 = 4,5 % + те же надбавки: 6,5 -> 7,25 -> 8,5 / 9,0 / 9,0 -> 8,5 / 9,5 / 9,5 -> 8,5 / 9,5 / 10,0 [Р]. Вычет «жёсткого» 0,3 п.п. с 2028 [В], ось 0-0,6.
  n20:                                                   # Н20.0 группы из BV - аддитивные вычеты, растущие с RWA (MODEL §4.11)
    deductions_anchor: 197.990                           # Ded20_0 = BVreg - (базовый + дополнительный капитал группы) = 758.456 - 560.466 [Р: МСФО 6М26 с. 6; ф. 0409805] класс A
                                                         #   = 3.74 % RWA; пять дат после Росбанка 3,25-3,87 %; состав: НМА 73,9, прочие вычеты 8,5, периметр и учёт 113,9, поправка фонда FVOCI 1,7
    fvoci_recognition: 0.64                              # доля фонда FVOCI в нормативе = доля ОФЗ в долговых FVOCI 214,2 / 333,0 [В: состав фонда не раскрыт] класс C; ось 0,50-0,80
    t2: {LT: 123.182}                                     # регуляторные инструменты группы без прибыли = добавочный капитал [Ф: ф. 0409805 стр. 105] класс A; постоянные в рублях [В]
                                                         #   ось «инструменты капитала»: сдвиг +-37.0 млрд руб. (+-0,7 п.п. RWA якоря) [В: LEAD-2 §7 п. 4]
    gap_pp: 0.0                                          # «Н20.0 - расчёт» на якоре: 0 по построению [Р]; ось -0,3…+0,3 п.п. (ошибка формы на пяти датах: СКО 0,24) класс A
  n11:                                                   # Н20.1 группы (MODEL §4.11; слот n1_1)
    deductions_anchor: 168.895                           # Ded11_0 = BVreg - E_0 - базовый капитал группы = 758.456 - 98.589 - 490.971 [Р] класс B (E - суждение о базисе)
    gap_pp: 0.00114                                      # Н20.1 - базовый / RWA(Н20.0): знаменатели Н20.1 и Н20.0 различаются на 64 млрд руб. [Р: ф. 0409805] класс A
    audit_cutoffs: [3, 4]                                # прибыль 9М входит в базовый капитал с формы на 01.12, года - с 01.04 [Ф: ф. 0409123: +56,1 и +32,9] класс A
  rwa:
    density: {cards: 1.7784, cash_loans: 1.7784, auto: 1.3493, mortgage: 0.6389, sme_loans: 0.4991, corp_loans: 0.4698, securities: 0.0993, liquidity: 0.0298, other_assets: 0.7121, other_assets_fixed: 0.0}
                                                         # RWA группы / остаток книги МСФО; сумма = вменённые RWA группы 5287.3 [Р/В: разбивка RWA банка x 0,9929] класс B
                                                         #   розница: 145 % ссуд ФЛ ф. 101 с надбавками [Ф: презентация 2К26 с. 20]; надбавки по продуктам и веса бизнеса - [В]
    density_drift_rate: 0.010                            # [В] класс C: ступени операционного риска 4К (+30 / +22 / +15 %) против надбавок (-2 % в год) и
                                                         #   постоянной части; история в форме ядра: -5,4 % за год до якоря (продажа портфелей и секьюритизация +127 млрд руб.)
                                                         #   ось листа -2,5…+3,5 % в год; ось LEAD-2 -4…+2 % - если программа продаж портфелей продолжится
    density_drift_until: 2027                            # последний год дрейфа [В: к концу 2027 года индекс выходит на +1,5 %; LEAD-2 §7 п. 6 - «до 2028»]
    fx: {enabled: false, share: null, foreign_inflation: null}   # валютная переоценка RWA выключена: доля не раскрыта
  recapitalization: {enabled: false}
  growth_constraint:                                     # рост, ограниченный капиталом [В: LEAD-2 §5] класс C
    enabled: true
    order: dividend_first                                # цена порядка печатается: проба листа - дивиденды 2П2026-2030 286 против 157 млрд руб. при growth_first (мир H, mid)
    min_growth_scale: 0
    lookahead_quarters: 8                                # ступень 1,75 п.п. при 0,25 п.п. за квартал требует 7 кварталов; проба: H = 4…12 итог не меняет
    glide_pp_per_quarter: 0.0025                         # проба: при 0 требование нарушено на якоре (mid, strict); при 0,005 - срез дивиденда в 4К2027
    catch_up_rate: 0.25                                  # ось 0-0,5: уровень кредитов к потенциальному на конец 2032 (мир H, mid) 82 / 90 / 93 %
    tol: 0.0001

regimes:
  crisis:
    rwa_density_mult: {"2027": 0.90, "2028": 0.933, "2029": 0.967, LT: 1.0, LT_from: 2030}
                                                         # роспуск макронадбавок: их доля в RWA банка 19,3 % [Ф: презентация 2К26 с. 20]; 0,90 = роспуск половины [В] класс C
                                                         #   ось: сдвиг -0,09…+0,10 на годы 2027-2029 (полный роспуск 0,81 … без роспуска 1,0)

unc_axes_proposal:                                       # оси полосы по ключам листа (вид, пути, границы)
  - {name: "Запас менеджмента над минимумом", kind: value, paths: [capital.mgmt_buffer.n20_0, capital.mgmt_buffer.n1_1], low: 0.005, high: 0.030, dist: triangular, unit: pp}
  - {name: "Инструменты капитала", kind: shift, paths: [capital.n20.t2], low: -37.0, high: 37.0, dist: triangular, unit: bn}
  - {name: "Дрейф плотности RWA до 2027", kind: value, paths: [capital.rwa.density_drift_rate], low: -0.025, high: 0.035, dist: triangular, unit: pct}   # LEAD-2: -0.04…+0.02
  - {name: "Поправка Н20.0 (мост МСФО - группа)", kind: value, paths: [capital.n20.gap_pp], low: -0.003, high: 0.003, dist: triangular, unit: pp}
  - {name: "Кризис: роспуск макронадбавок", kind: shift, paths: [regimes.crisis.rwa_density_mult], low: -0.09, high: 0.10, dist: triangular, unit: number}
  - {name: "Вычет «жёсткого» сценария", kind: value, paths: [capital.reg_scenarios.strict.deduction_pp.n20_0.2028, capital.reg_scenarios.strict.deduction_pp.n1_1.2028], low: 0.0, high: 0.006, dist: triangular, unit: pp}
  - {name: "Навёрстывание роста", kind: value, paths: [capital.growth_constraint.catch_up_rate], low: 0.0, high: 0.5, dist: triangular, unit: number}
  - {name: "Дюрация FVOCI", kind: value, paths: [oci.fvoci_duration], low: 0.7, high: 2.3, dist: triangular, unit: years}
  - {name: "Срок подтягивания FVOCI", kind: value, paths: [oci.fvoci_maturity], low: 2.0, high: 5.0, dist: triangular, unit: years}
  - {name: "Признание фонда FVOCI в нормативе", kind: value, paths: [capital.n20.fvoci_recognition], low: 0.50, high: 0.80, dist: triangular, unit: pct}

checks_proposal:                                         # коридоры гейтов капитала [В: проба части 5; имена гейтов - за методикой]
  anchor_capital_tol: 0.0001                             # якорь: |Н20.0 расчёт - факт| и |Н20.1 расчёт - факт|, доли (условие калибровки)
  growth_cut:                                            # урезанный рост, клетки без шока
    level_2030_min: 0.65                                 # кредиты к потенциальному пути на конец 2030: проба 0,72-0,96 по девяти клеткам
    lambda_year_min: 0.40                                # средняя за год доля прироста: проба 0,54-1,00 (квартальная lambda в 4К ниже из-за двух вычетов дивиденда)
    zero_growth_quarters_max: 0                          # кварталов с lambda < 0,05 в модальной клетке
  step_quarter_dividend_cut: 0.0                         # срез дивиденда политики в 1К2027 и 1К2028, млрд руб. (аналитический тест): проба - 0 во всех девяти клетках
  capital_gap_mass_max: 0.0                              # масса клеток без шока с нормативом ниже пола: проба - 0 (минимум отчётного Н20.1 над полом +1,3 п.п.)
  n20_requirement_tol: 0.0001                            # урезанная клетка держит норматив на требовании
  estimate_before_f805: {n20_0: 0.003, n20_1: 0.002}     # допуск оценки «Н1.x банка + разность» против формы, доли (СКО 0,24 и 0,11 п.п.)
