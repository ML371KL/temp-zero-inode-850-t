# Книга допущений Т-Технологий (850-t) — ШАБЛОН машинной книги, версия 1.0 (запись версии в журнале — 08.10.2026;
# дата книги meta.date — 07.10.2026: день цены и оценки, на которых книга собрана).
# Из шаблона data/assumptions/build_assumptions.py собирает машинную книгу assumptions.yaml (+ .json): вписывает миры семейства
# (worlds.N|H|M — на место строки-метки WORLDS в блоке worlds), банковскую надстройку (worlds_bank — строка-метка WORLDS_BANK)
# и её sha256 (метка OVERLAY_SHA256). Правят шаблон; машинную книгу — только сборкой.
# Текст и обоснования — ASSUMPTIONS-BOOK.md (идентификаторы A-xx те же), расчёты — evidence/<область>/.
# Схема ключей — полная (docs/MODEL.md, приложение A); значения — книги 1.0: сводка этапа 1 (43 оси полосы, 13 строк
# обратного расчёта) и решения ведущего № 1–8 (при расхождении действует более позднее).
# Метки в комментариях:
#   [Ф]  — факт с источником; [Р] — расчёт по фактам; [В] — суждение (проект, этап 1 или автор книги).
#   Метка с текстом после двоеточия у ключа, на котором стоит ось полосы, — ИСТОЧНИК СУЖДЕНИЯ ДЛЯ ВИТРИНЫ: выпуск печатает
#   этот текст как есть (не длиннее 80 знаков). Поэтому он написан словами для владельца: без имён листов, ключей и
#   рабочих пометок, даты — с годом; у такого ключа метка с текстом одна, прочие пояснения — вне меток.
#   null — только там, где ядро ключ не читает: выключенный блок (`enabled: false` или названный выключатель, MODEL прил. A),
#          ключ неактивного режима календаря дивидендов или хэш файла, который строит сборка книги; в читаемом пути
#          null — отказ BookError (null ≠ 0).
#   "anchor" — значение выводится из фактов якоря (data/facts/*.json) при загрузке книги (формула — MODEL прил. A).
#   ВЫВЕДЕНО НА ЯДРЕ — число следует из суждения книги и из решения передачи ставки либо из пути баланса клеток: его
#          вывела одна команда (evidence/path/derive_on_engine.py) на ядре с включённым ограничением роста — один раз
#          (09.10.2026, связанные шаги повторены до сходимости): доли раскладки сдвига и сжатия маржи — решением передачи
#          на составе баланса якоря; ближний сдвиг, инструменты капитала и спред услуг — на модальной клетке; корни расходов
#          — на слое «Рыночные ставки как есть». После этого число ЗАМОРОЖЕНО: оси, обратный расчёт, «цена правила», справочные
#          варианты и сравнение версий его не пересчитывают. У новой версии книги до вывода ключ несёт пометку
#          «ВЫВОДИТСЯ НА ЯДРЕ».
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли (0,001 = 0,1 п.п.).
# Всё «на акцию» — после дробления 1:10 (15.04.2026).
# Траектории: {ключ: значение}; ключи "2026Q3" (квартал), "2026H2" (полугодие), "2027" (год), LT и LT_from (год выхода на LT).
# Ключ "2026" действует на 3-й и 4-й кварталы 2026 года (якорь — 2-й квартал). Правило чтения — docs/MODEL.md §0.4.
# Незнакомый ключ — отказ BookError (закрытая схема).

