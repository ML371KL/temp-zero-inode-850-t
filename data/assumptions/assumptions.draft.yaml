  erp: 0.0557  # премия за риск, доля [конвенция семейства]; ось 0,049…0,062
  roll_along_forwards: true  # перекат дисконта по форвардам кривой книги
  governance:  # дисконт за управление, доля V0 [Р: лист каналов — ни один канал опоры не имеет; решение № 4, п. 10]; ось 0…0,10
    discount: 0.0
    components:
      - {id: related_party_deals, name: "Сделки с крупнейшим акционером и его структурами", value: 0.0, sign: 1, basis: "Росбанк получен 15.08.2024 у структур крупнейшего акционера за 689,7 млн акций по 342,36 ₽ — на 19 % выше рынка; чистые активы 186,7 млрд ₽ за вычетом неконтролирующей доли 1,1 млрд ₽ против возмещения 176,9 млрд ₽ дали прибыль от выгодной покупки 8,7 млрд ₽ (отчётность МСФО за 2025 год, примечание 4), а прибыль на акцию за 2025 год, по оценке эмитента, выросла на 9 %; объявленная 01.10.2026 покупка «Точки» (оценка 84,8 млрд ₽, акции по 320 ₽ — на 27 % выше рынка) до синергий снижает прибыль на акцию примерно на 0,9 % (оценка) и войдёт в книгу фактами после закрытия; по записи 2024–2026 годов передачи стоимости от миноритариев нет"}
      - {id: motivation, name: "Программа мотивации: выпуск акций сверх запаса и расхода", value: 0.0, sign: 1, basis: "за 2024 год — 1-е полугодие 2026 года гранты за вычетом выбывших — 176,4 млн акций, выкуплено и получено при сделке 179,9 млн; новых акций под программу не выпускали (отчётность МСФО за 6 месяцев 2026 года, примечания 22 и 27); расход уже в прибыли, все 132,8 млн собственных акций — в делителе, разрыв с обязательствами программы (177,3 млн) — 44,5 млн акций, 1,66 %, — внутри оси числа акций"}
      - {id: depositary_block, name: "Невыплачиваемые дивиденды депозитарного блока", value: 0.0, sign: 1, basis: "245,75 млн акций (9,16 %) на счёте депозитарных программ не голосуют, дивиденды по ним начисляются, но не выплачиваются (закон № 452-ФЗ): на 31.12.2025 — 5,48 млрд ₽ (отчётность МКПАО по РСБУ за 2025 год), около 4,3 млрд ₽ в год; это долг перед держателями расписок, капитал он уже уменьшил, выгоды или потери для остальных акционеров нет"}
      - {id: liquidity_listing, name: "Ликвидность и листинг", value: 0.0, sign: 1, basis: "первый уровень листинга, вес в индексе Мосбиржи 5,13 % на 06.10.2026, медианный оборот 4,6 млрд ₽ в день за 12 месяцев к 06.10.2026 — 0,64 % капитализации в день против 0,13 % у Сбербанка"}
      - {id: holding_layer, name: "Холдинговый слой: долг и связанные стороны", value: 0.0, sign: 1, basis: "долг нефинансовых компаний группы — 249,9 млрд ₽ на 30.06.2026, из них 159,3 млрд ₽ — связанным сторонам; средства акционеров обходятся группе в 8,3 % годовых при ключевой 15,2 % (отчётность МСФО за 6 месяцев 2026 года, примечания 21 и 27) — в пользу группы; проценты уже в прибыли; запас распределяемой прибыли МКПАО 50,7 млрд ₽ — около года дивидендов — ограничение книги, не потеря"}
