# ------------------------------------------------------------------ ДИВИДЕНДЫ: политика, календарь
dividends:
  policy:
    name: "Положение о дивидендной политике МКПАО „Т-Технологии“ (редакция 2, совет директоров 20.03.2025)"  # документ политики
    base: ifrs_ni_shareholders  # строка прибыли акционеров фактов — операционная прибыль акционеров
    deduct_at1_after_tax: false  # бессрочных инструментов в капитале МСФО нет
    payout: {LT: 0.26}  # доля средней операционной прибыли четырёх кварталов [Р: факт шести решений 24,4–27,7 %, среднее 25,86 %; решение № 4, п. 18]
    metric: n20_0  # норматив условия
    threshold: 0.0  # числового порога в политике нет [Ф]
    steps: []  # ступеней нет (в квартальном режиме список пуст)
    shortfall_rule: residual_above_requirement  # при нехватке — остаток сверх требований
    divisor: issued  # DPS = пул / размещённые акции
    dps_rounding: half_up_kopeck  # при тесте cap не читается
    forecast_rounding: none  # прогнозный DPS не округляется
    history_test: cap  # вид теста истории [П]: потолок политики (решение № 2, §3 п. 6)
    cap: 0.3  # потолок выплат года к отчётной прибыли акционеров, доля [Ф: политика, п. 4.1]
    base_window_quarters: 4  # окно базы, кварталов [П] (решение № 2, §3 п. 2)
  payout_deviation: {LT: 0.0}  # отклонение доли, доля; ось −0,05…+0,04 (доля 0,21–0,30; решение № 4, п. 18)
  excess: {from_profit_year: 2032, epsilon: 0.5, ramp_years: 3}  # выплата доли избытка капитала с года прибыли, ввод за три года [В: решение № 2, §3
      #   п. 5; у эмитента опоры нет]; ось ε 0…1
  crisis: {skip_in_shock_year: true, catch_up: false}  # год шока отменяет решения модели; догоняющей выплаты нет (решение № 2, §3 п. 4)
  buyback: {enabled: false}  # модуль выключен
  calendar:
    frequency: quarterly  # режим календаря [П] (решение № 2, §3 п. 1)
    decision_lag_quarters: {"1": 2, "2": 2, "3": 1, "4": 2}  # лаг решения по номеру квартала прибыли, кварталов [Р: история решений; лаг за 3-й
        #   квартал — суждение]
    reg_deduction_lag_quarters: 2  # лаг вычета из регуляторного капитала, кварталов [Р: реестр — 2 квартала в семи решениях из восьми]
    payment_lag_quarters: 2  # лаг выплаты, кварталов [Р: лист рынка]
    checkpoints_ahead: 0  # проверка — в квартале решения (решение № 3, п. 12)
    agm_quarter: null  # ключ годового режима — не читается
    reg_deduction_quarter: null  # ключ годового режима — не читается
    payment_quarter: null  # ключ годового режима — не читается
    checkpoints: null  # ключ годового режима — не читается

# ------------------------------------------------------------------ МОСТ
bridge: {declared_dividends: register, governance_applies: false}  # мост — объявленные дивиденды реестра; дисконт за управление к ним не применяется

