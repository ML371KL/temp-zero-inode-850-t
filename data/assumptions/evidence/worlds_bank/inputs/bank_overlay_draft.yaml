    as_of: "2026-10-23"
    recipe: "N — середины диапазонов базового сценария Банка России: среднесрочный прогноз 23.10.2026 (forecast_261023.pdf, с. 1, sha256 0e007c6d…; те же числа — табл. 3.2 итоговой ОНДКП 2027–2029 от 28.10.2026, PDF-с. 73), кроме «прочей розницы» 2026–2027 — прогноз ЦБ по балансам («Банковский сектор. II кв. 2026», PDF-с. 20 / печ. 19, sha256 ed4826f8…) и 2028–2029 — [Р] (население − w·ИЖК)/(1 − w), w = 0,5806 (доля ИЖК в задолженности ФЛ на 01.08.2026, dataservice ЦБ). H и M — реальный рост базы при инфляции своего мира: g_W = (1 + g_N)·(1 + π_W)/(1 + π_N) − 1, π — средний ИПЦ мира за год по записи миров семейства 1.7 (worlds_source.json, sha256 1e905cb7…); 2026 — одинаково во всех мирах. credit_growth.corporate — «организации», mortgage — ИЖК, retail_other — «прочая розница»; funds_growth.retail = funds_growth.corporate = М2 (раздельных рядов нет); nominal_gdp_growth — справочно. Середины диапазонов → доли. Годы 2026–2029; после 2029 ядро сводит рост объёмов к g_T мира к volumes.lt_from (MODEL §4.3). Сборщик — data/assumptions/evidence/worlds_bank/build_overlay.py; вход — черновик надстройки (evidence/worlds_bank/inputs/bank_overlay_draft.yaml)."
