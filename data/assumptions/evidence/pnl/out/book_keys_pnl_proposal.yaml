# Предложение ключей книги по строкам ОПУ, налогу, НДУ, непрофильному результату и дивидендной базе
# (этап 1, ключ calib-pnl, 07.10.2026). Собрано s5_proposal.py из выходов s1–s4 (out/*.json, out/*.csv); руками не править.
# [class] — надёжность: A — факт документа, B — расчёт по фактам, C — суждение. src — текст для витрины (≤ 80 знаков).
# Якорь 30.06.2026; строки движка — на операционном базисе (LEAD-2 §1); формулы связи — LEAD-2 §4.

fees.growth_override: {}
#   class: A; src: "гайденса по комиссиям на 2026 год у эмитента нет"
#   note: пусто: формула связи действует с 3К2026
fees.volume_link: 0.7
#   class: C; src: "суждение книги: связь услуг с ростом портфеля; факт трёх кварталов 0,5–0,7"
#   note: калибровка: при связи 0.66 C/I модальной клетки 2030 = 47 % без реального роста расходов; по трём чистым кварталам 0,54–0,67
fees.growth_vs_wages: {LT: 0.0}
#   class: C; src: "суждение книги: без спреда к формуле связи; факт 1П2026 +17,7 % г/г"
#   axis: shift −0.01…+0.01
#   note: ось узкая: уровень C/I несёт ось расходов (одно суждение — одно место)
opex.volume_link: 0.7
#   class: C; src: "суждение книги: 0,7 пункта роста расходов на пункт роста портфеля"
#   note: структура расходов 1П2026: привлечение 30 % и обслуживание 22 % — с объёмом, технологии и административные 47 % — на 0,3
opex.real_growth: {"2026": 0.015, "2027": -0.004, "2028": -0.004, "2029": -0.004, "2030": -0.004, "2031": 0.006, "2032": 0.006, LT: -0.0008, LT_from: 2033}
#   class: C; src: "подбор: C/I после фазы роста 47 % (среднее семи кварталов после Росбанка)"
#   axis: shift -0.016…+0.015 (ключи 2027–2030)
#   note: корни простого расчёта модальной клетки; концы оси дают C/I 44 и 50 %; после сборки ядра корни пересчитать тем же правилом
volumes.link_base: loans
#   class: B; src: "база связи — средний валовой кредитный портфель квартала, рост г/г"
#   note: средства клиентов растут иначе (+8…+12 % г/г при кредитах +21…+27 %)
other.insurance_volume_link: 0.0
#   class: B; src: "страхование нетто шесть кварталов 9,8–12,8 млрд ₽ при росте портфеля на 37 %"
#   note: с портфелем не растёт
other.insurance_growth_vs_wages: {"2026": -0.06, "2027": -0.03, LT: 0.0, LT_from: 2028}
#   class: C; src: "факт 1П2026 +1,8 % г/г; сход к росту зарплат мира к 2028 году"
#   note: суждение о сроке схода
other.misc_net_real: {LT: 21.0}
#   class: B; src: "прочее без пакета Яндекса: медиана квартала 2025–1П2026 × 4, цены 2026"
#   axis: value 8.0…34.0
#   note: 1П2026 в годовом выражении 20.6; четыре квартала 28.0; шесть кварталов без разового дохода 27.6 в год
other.misc_quarter_shares: {"1": 0.25, "2": 0.25, "3": 0.25, "4": 0.25}
#   class: B; src: "сезонности «прочего» в шести кварталах 2025–2026 нет — поровну"
#   note: крупные кварталы — разовые сделки (3К2024, 2К2025)
other.fvtpl_bond_reval: false
#   class: A; src: "облигации по СС через ОПУ 14,3 млрд ₽ — переоценка в уровне «прочего»"
#   note: выключатель FVR
noncore.result_real: {"2026": 10.13, "2027": 8.1, "2028": 6.97, "2029": 6.1, "2030": 5.5, "2031": 4.94, "2032": 4.69, "2033": 4.44, "2034": 4.21, "2035": 3.99, "2036": 3.78, LT: 3.78}
#   class: C; src: "пакет Яндекса зарабатывает проценты по долгу под него; цены 2026"
#   axis: shift −5.4…+5.4 (ключи 2027–LT)
#   note: возврат процентов: поправка эмитента / 0,75; долг постоянен в рублях, ставка — ключевая мира H + 1 п.п.; ось = ±4 млрд ₽ в год акционерам после налога
noncore.price_base_year: 2026
#   class: A; src: "год якоря"
pnl.nci_share: 0.024
#   class: B; src: "НДУ в операционной прибыли 1П2026: 2,5 из 101,1 млрд ₽ (без эффекта пакета)"
#   note: четыре квартала 3К25–2К26 — 3.1 %; под НДУ — 49,99 % прибыли «Каталитик Пипл» («Точка», «Селектел»)
tax.statutory: {"2026": 0.25, LT: 0.25}
#   class: A; src: "ставка налога на прибыль 25 % с 2025 года (закон 176-ФЗ)"
#   axis: shift 0…+0.03
tax.effective_gap: -0.006
#   class: B; src: "эффективная ставка на операционном базисе: 24,2 % (2025), 24,8 % (1П2026)"
#   note: шесть кварталов 1К25–2К26: 24.40 %
tax.one_off: {year: 2027, amount: 25.0, prob: 0.0}
#   class: C; src: "суждение книги: разовое изъятие ≈12 % годовой прибыли, вероятность 0"
#   axis: prob 0…0.30
#   note: масштаб — как в книге Сбера (200 из ≈1 700)
equity.other_movements: {LT: 0.0}
#   class: B; src: "резерв мотивации +15,4 и выкуп −14,0 млрд ₽ за четыре квартала гасятся"
#   note: с прочими движениями -0.37 млрд ₽ за квартал; до возобновления выкупа (4К24–2К25) — +5…+10
dividends.policy.payout: {LT: 0.25}
#   class: B; src: "факт к средней операционной прибыли четырёх кварталов: 24,4–27,7 %"
#   axis: payout_deviation shift −0.05…+0.05
#   note: среднее шести решений 25.86 %; несмещённый центр по факту — 0,26
dividends.policy.base_window_quarters: 4
#   class: B; src: "разброс доли к базе четырёх кварталов 1,2 п.п. против 2,1 к кварталу"
checks.guidance_items: [op_np_growth, dps_growth]
#   class: A; src: "прогноз эмитента на 2026 год: операционная прибыль и DPS — от +20 %"
#   note: roe_target — цель стратегии, в гейт не входит
checks.cir_range: [0.40, 0.58]
#   class: C; src: "CIR движка: цель 48,6 %; история 2024–2026 по кварталам 46,4–53,6 %"
#   note: клетки простого расчёта 47,7–51,5 %; концы оси 45,6–51,6 %
checks.bridge_drift_pp: {cor: 0.002, nim: 0.003}
#   class: B; src: "мост упр. ↔ движок: 2,5σ; у ЧПМ — с рябью счёта дней 0,11 п.п."
#   note: σ CoR 0.076 п.п.; σ ЧПМ без ряби и тренда 0.060 п.п.
checks.roe_range: [-0.05, 0.36]
#   class: C; src: "ROE года: факт 26,7–33,3 % по кварталам; год кризиса ≈ 2 %"
#   note: операционная прибыль к капиталу акционеров МСФО
checks.cor_range: [0.03, 0.12]
#   class: C; src: "CoR года, базис движка: пути режимов 4,0–10,0 % минус мост 0,24 п.п."
#   note: верх — год кризиса с добавкой κ мира M

# ---- оси полосы (форма valuation.uncertainty.axes шаблона)
axes:
  - {name: "Расходы: реальный рост 2027–2030 (C/I 44–50 %)", kind: shift, paths: [opex.real_growth.2027, opex.real_growth.2028, opex.real_growth.2029, opex.real_growth.2030], low: -0.016, high: 0.015, dist: triangular, unit: pp}
  - {name: "Услуги: рост к формуле связи", kind: shift, paths: [fees.growth_vs_wages], low: -0.01, high: 0.01, dist: triangular, unit: pp}
  - {name: "Пакет Яндекса и долг под него (цены 2026)", kind: shift, paths: [noncore.result_real.2027, noncore.result_real.2028, noncore.result_real.2029, noncore.result_real.2030, noncore.result_real.2031, noncore.result_real.2032, noncore.result_real.2033, noncore.result_real.2034, noncore.result_real.2035, noncore.result_real.2036, noncore.result_real.LT], low: -5.4, high: 5.4, dist: triangular, unit: bn}
  - {name: "Прочее ОПУ (цены 2026)", kind: value, paths: [other.misc_net_real.LT], low: 8.0, high: 34.0, dist: triangular, unit: bn}
  - {name: "Налог: сдвиг ставки", kind: shift, paths: [tax.statutory], low: 0.0, high: 0.03, dist: triangular, unit: pp}
  - {name: "Разовый налог: вероятность", kind: value, paths: [tax.one_off.prob], low: 0.0, high: 0.30, dist: triangular, unit: pct}
  - {name: "Отклонение выплаты от политики", kind: shift, paths: [dividends.payout_deviation], low: -0.05, high: 0.05, dist: triangular, unit: pp}

# ---- факты моста (facts/bridge_mgmt_ifrs.json; полный узел — out/bridge_mgmt_ifrs_proposal.json)
bridge_mgmt_ifrs:
  cor: {method: additive, value: -0.002449, sd: 0.000756, n: 7, window: [2024Q4, 2026Q2]}
  nim: {method: additive, value: -0.001219, sd: 0.000604, n: 2, window: [2026Q1, 2026Q2], alt_window_mean: -0.002819}
  cir: {method: additive, value: 0.015672, sd: 0.009088, n: 7, window: [2024Q4, 2026Q2]}
