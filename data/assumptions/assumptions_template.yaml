      - {name: "Дюрация FVOCI", kind: value, paths: [oci.fvoci_duration], low: 0.7, high: 2.3, dist: triangular, unit: years}
      - {name: "Срок подтягивания FVOCI", kind: value, paths: [oci.fvoci_maturity], low: 2.0, high: 5.0, dist: triangular, unit: years}
      - {name: "Признание фонда FVOCI в нормативе", kind: value, paths: [capital.n20.fvoci_recognition], low: 0.50, high: 0.80, dist: triangular, unit: pct}
    off_band_axes: []                                          # оси вне полосы — пусто. Ось допустима здесь только при трёх условиях MODEL §10: ожидаемая доля
                                                               #   в дисперсии < 1 %, сдвиг положения оси и сумма сдвигов по осям вне полосы меньше print_step/10;
                                                               #   односторонние рисковые оси (налог, разовый налог, разовый убыток кризиса) и словари — никогда
  reverse_dcf:                                                 # обратный расчёт медианы (MODEL §11); search — отрезок поиска (технический), range — диапазон книги
    subsample: 200
    edge_refine_rub: 5.0                                       # решение подвыборки сразу за краем диапазона книги уточняется на полной полосе, если невязка подвыборки на краю
                                                               #   диапазона не больше этого порога, ₽ (MODEL §11.2): около двух стандартных ошибок подвыборки (у строки ключа цели
                                                               #   маржи — 2,3 ₽), шаг печати; пометку «в диапазоне / вне» у такой строки ставит корень полной полосы [В]
    axis_follow: both                                          # ось полосы идёт за проверяемым значением обоими концами в пределах отрезка поиска (MODEL §11.1)
    refine_rows: [nii.nim_lt_target_mgmt, "regimes.*.cor.LT"]  # строки, чей корень уточняется на полной полосе (MODEL §11.2): уровень маржи и стоимость риска —
