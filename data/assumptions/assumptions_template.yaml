    psi: 2.0                                                   # доля на долю ключевой [Р/В: Доля текущих счетов против ключевой ставки в эпизодах 2019–2026 годов]
                                                               #   отклики на снижение ставки −0,31 / 1,94 / 3,96; ось 1,0–4,0
