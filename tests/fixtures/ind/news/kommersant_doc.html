<title>Совет директоров «Т‑Технологий» назвал размер дивиденда за третий квартал</title></head><body>
<article><p>Совет директоров «Т‑Технологий» рекомендовал выплатить дивиденды по результатам III квартала 2026 года в размере 4,9 рубля на акцию, следует из сообщения компании.</p>
