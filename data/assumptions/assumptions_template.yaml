  fvoci_duration: 1.5                                          # эффективная дюрация к ОФЗ 3 лет, лет [Р/В: Переоценка облигаций против доходности ОФЗ 3 лет в 2025–2026 годах]
                                                               #   2,1 по трём кварталам из четырёх, 0,8–1,4 по году; ось 0,7–2,3 года
  fvoci_maturity: 3.0                                          # срок подтягивания к номиналу, лет [В: Суждение: сроки облигаций в отчётности не раскрыты]
                                                               #   ось 2–5 лет
