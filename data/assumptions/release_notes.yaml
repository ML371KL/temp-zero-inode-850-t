# Записки о ЗАДУМАННЫХ скачках печатаемого заголовка — книга Т-Технологий (MODEL §14.4; читает model/payload.py).
#
# Правило то же, что у гейтов: скачок разрешён, НЕ ЗАМЕЧЕННЫЙ скачок — нет. Скачок печатаемой медианы больше
# valuation.headline.jump_guard.median_pct или V0 слоя «свой взгляд» больше jump_guard.v0_pct против прошлого выпуска
# (после вычета дивидендов, прошедших экс-дату между выпусками: DPS × акции в обращении / делитель) роняет сборку
# (инвариант jump_guard), если его не объясняет новая версия книги, новая дата фактов или действующая записка отсюда.
# На витрине остаётся прежний выпуск.
#
# Формат — список записей:
#
#   - valid_until: 2026-11-30         # включительно; просроченная записка считается отсутствующей
#     expected_central: 0.0           # ТОЧНЫЙ центр выпуска, ₽ (не печатаемый), который ожидается после правки
#     tolerance_pct: 5                # допуск к нему, % (не больше 25)
#     note: >-
#       Что двинуло заголовок и почему это правильно — текстом для владельца.
#
# Первый выпуск на книге 1.0 записки не требует (новая версия книги).
[]
