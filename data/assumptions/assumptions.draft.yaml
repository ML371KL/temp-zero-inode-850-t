# ------------------------------------------------------------------ МИРЫ — запись семейства и банковская надстройка
worlds:
  source:  # байтовая копия записи миров семейства [Ф]; проверка — worlds_recipe.py --check
    record: worlds_source.json
    origin: "magnit-850oa book-1.6"
    record_asof: "2026-09-21"
    curve_date: "2026-09-18"
    sha256: "7296567d5200b5599efd0989de6ed8c8461d56c5c5dda244ab7d622303969fec"
    recipe: [worlds_inputs.yaml, worlds_recipe.py, WORLDS-RECIPE.md]
  build:  # блоки worlds.N|H|M машинной книги пишет build_assumptions.py из копии (MODEL §3.1)
    script: build_assumptions.py
    fields: [key_rate, cpi, wage_growth, ofz_1y, ofz_3y, ofz_5y, ofz_10y, real_key, zero_curve, lt_inflation]
  quarter_rule: half_year_value  # квартал берёт значение своего полугодия (MODEL §0.4)
  ids: ["N", H, M]  # миры: нормализация, высокие надолго, рыночный как есть
  overlay:  # банковская надстройка миров — общий файл банковских панелей семейства [Ф: ОНДКП, проект 30.09.2026; H и M — пересчёт по инфляции мира]
    file: worlds_bank.json
    sha256: "6fb82a41c4aa558c1f9a11323c7602ea0feb82e09d7430e85d4ea696ed03037a"
    fields: [credit_growth.corporate, credit_growth.mortgage, credit_growth.retail_other, funds_growth.retail, funds_growth.corporate, nominal_gdp_growth]

# ------------------------------------------------------------------ ВЕРОЯТНОСТИ: миры, режимы, сценарии капитала; обучение A-P2u
joint:
  world_prob: {"N": 0.35, H: 0.45, M: 0.2}  # веса миров слоя «свой взгляд», доли [запись семейства]; ось — словарь
  world_prob_market_implied: {"N": 0.1, H: 0.25, M: 0.65}  # веса миров, вменённые рынком, доли [запись семейства]
  macro_neutral_world: M  # мир слоя «рыночные ставки как есть»
  own_macro_confidence: 0.5  # λ — доверие своему взгляду на ставки, доля [запись семейства]
  regime_prob: {soft: 0.15, norm: 0.4, downturn: 0.3, crisis: 0.15}  # вероятности режимов, доли [В: решение ведущего № 2, §8 п. 3; частоты истории
      #   эмитента на нынешнем составе портфеля 0,33 / 0,33 / 0,17 / 0,17]; ось —
      #   P(кризис) 10–25 %
  reg_prob_given_regime:  # P(сценарий капитала | режим), доли [В: решение № 2, §7 п. 5; опоры в данных нет]
    soft: {schedule: 0.35, mid: 0.45, strict: 0.2}
    norm: {schedule: 0.35, mid: 0.45, strict: 0.2}
    downturn: {schedule: 0.35, mid: 0.45, strict: 0.2}
    crisis: {schedule: 0.7, mid: 0.25, strict: 0.05}
  regime_update:
    observables:
      cor: {sigma_pp: 0.0085, rho_q: 0.25}  # σ — доля годовых (0,85 п.п.), ρ — за квартал [Р/В: решение № 2, §8 п. 4; лист режимов: σ 0,58–0,94 п.п.
          #   по шести срезам]
      nim: {sigma_pp: 0.0035, rho_q: 0.3}  # σ 0,35 п.п., ρ за квартал [В: решение № 2, §8 п. 4; ρ на семи кварталах не определяется] — уточнит
          #   калибровка после калибровки книг ЧПД
    max_shift_pp: 0.05  # предел сдвига вероятности режима за наблюдение, доля [как у образца]
    window_obs: 4  # окно: число последних наблюдений [как у образца]
    floor_share: 0.33  # пол вероятности режима — доля базовой [как у образца]
    shrink_by_se: true  # сжатие обновления по ошибке наблюдения [как у образца]
    observations: []  # наблюдений нет; вносятся в базисе движка (решение № 4, п. 12)

