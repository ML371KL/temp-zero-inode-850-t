      - {name: "Запас над минимумом норматива", kind: value, paths: [capital.mgmt_buffer.n20_0, capital.mgmt_buffer.n1_1], search: [0.0, 0.08], range: [0.005, 0.025], unit: "п.п."}
      - {name: "Выплата (отклонение доли от политики)", kind: shift, paths: [dividends.payout_deviation], search: [-0.25, 0.5], range: [-0.05, 0.04], unit: "п.п."}
      - {name: "β_E", kind: value, paths: [valuation.beta_e], search: [0.3, 3.5], range: [0.95, 1.15], unit: ""}
      - {name: ERP, kind: value, paths: [valuation.erp], search: [0.02, 0.25], range: [0.049, 0.062], unit: "%"}
      - {name: "Регуляторный сценарий (смесь к «жёсткому»)", kind: mix, paths: [joint.reg_prob_given_regime], toward: {schedule: 0.0, mid: 0.0, strict: 1.0}, search: [0.0, 1.0], range: [0.0, 0.0], unit: "доля"}
      - {name: "Реальный рост терминала", kind: value, paths: [valuation.terminal.real_growth], search: [-0.05, 0.05], range: [0.005, 0.025], unit: "%"}
      - {name: "Угасание избыточной доходности", kind: value, paths: [valuation.terminal.fade], search: [0.0, 1.0], range: [0.25, 1.0], unit: ""}
      - {name: "Дисконт за управление", kind: value, paths: [valuation.governance.discount], search: [0.0, 0.9], range: [0.0, 0.1], unit: "%"}
    bank_rows: [implied_roe_through_cycle, implied_cost_of_equity, market_cap_minus_bv, value_without_excess_growth, book_value_per_share, excess_return_years]  # три строки образца и три строки этой
        #   панели (договор ключей §3.5)
  next_report:  # открытый квартал и сетки наблюдений, упр. базис, доли [В: сводка этапа 1; решение № 4, п. 16]
    period: "2026Q3"
    cor_values: [0.04, 0.045, 0.05, 0.055, 0.06]
    nim_values: [0.11, 0.113, 0.116, 0.119, 0.122]
    search_pad: 0.002
    value_tol: 0.0001

# ------------------------------------------------------------------ ПРОВЕРКИ: допуски, коридоры гейтов, перечень узлов гайденса
checks:
  ddm_ri_tol: 0.001  # допуск DDM = RI, доля
  transmission_tol: 1.0e-09  # допуск решения передачи
  exdate_jump_tol: 0.01  # допуск скачка экс-даты, доля ожидаемого −DPS × N_out / N_div
  pb_by_world: {"N": [0.4, 2.0], H: [0.4, 2.0], M: [0.4, 2.0]}  # коридор P/B клетки по мирам [как у образца, пока счёт ядра не покажет иное]
  roe_range: [-0.05, 0.36]  # ROE года: операционная прибыль к капиталу МСФО [В: лист ОПУ]; уточнит калибровка
  cor_range: [0.03, 0.12]  # CoR года, базис движка [В: лист ОПУ]; уточнит калибровка
  nim_range: [0.08, 0.13]  # ЧПМ квартала, упр. базис [В: лист ЧПД]; уточнит калибровка
  cir_range: [0.4, 0.58]  # C/I года, базис движка [В: лист ОПУ]; уточнит калибровка
  roe_k_spread: {range: [-0.1, 0.1], max_world_gap: 0.08}  # однородность «ROE − стоимость капитала»; разрыв миров 0,08 — подтвердить счётом ядра
      #   (решение № 4, п. 16)
  terminal_share: [0.15, 0.65]  # доля терминала в стоимости [как у образца; при низкой выплате проверить на ядре]
  real_rate: [0.02, 0.13]  # реальная ставка LT мира [как у образца]
  bridge_drift_pp: {cor: 0.002, nim: 0.003}  # дрейф моста упр. ↔ движок, доли [Р: 2,5σ моста; решение № 4, п. 6]
  nim_path_joint: {quarters: 8, tolerance: 0.003}  # стык ближнего пути ЧПМ: кварталов и допуск, доля
  transmission_pairs: [-0.2, 0.3]  # коридор парных передач — покрывает концы оси передачи [Р: лист ЧПД]
  lt_spread_floor: {cards: 0.095, cash_loans: 0.075, auto: 0.025, mortgage: 0.005, sme_loans: 0.155, corp_loans: 0.0}  # полы эффективного LT-спреда кредитных
      #   книг, доли [В: правило листа ЧПД;
      #   решение № 4, п. 13]
  ni_jump: {quarters: 8, yoy: 0.4, key_tol: 0.01}  # флаг «прыжок прибыли»: порог г/г 0,40 (решение № 4, п. 16)
  m_crisis_vs_cbr:  # клетка «M × кризис» против рискового сценария ЦБ [В: сводка этапа 1; решение № 4, п. 16]; n20_min — проверить счётом ядра
    loan_growth: {"2027": [0.0, 0.05], "2028": [0.02, 0.07]}
    cor_shock_year: 0.095
    n20_min: 0.135
  manual_overdue_days: {ifrs_fact: 7, worlds_after_cbr: 21, dividend_register: 5, capital_form: 7}  # сроки ручного входа, дней; capital_form [П] —
      #   замена оценки нормативов фактом формы
  book_update: {shift_bp: 50, max_age_days: 45}  # флаг устаревания книги [как у образца]
  guidance_items:  # перечень узлов гайденса [О] (договор ключей §1.11); три последних узла — v: null в фактах
    - {key: op_np_growth, path: items.op_np_growth, title: "Рост операционной прибыли акционеров за год", words: "рост операционной прибыли", basis: mgmt, gate: true}
    - {key: dps_growth, path: items.dps_growth, title: "Рост дивиденда на акцию за год", words: "рост дивиденда на акцию", basis: mgmt, gate: true}
    - {key: roe_target, path: items.roe_target, title: "Цель ROE эмитента (к операционному капиталу)", words: ROE, basis: mgmt, gate: false}
    - {key: nim, path: items.nim, title: "ЧПМ", words: "ЧПМ (упр.)", basis: mgmt, gate: true}
    - {key: cor_max, path: items.cor_max, title: "Стоимость риска (не выше)", words: "стоимость риска (упр.)", basis: mgmt, gate: true}
    - {key: cir, path: items.cir, title: "C/I", words: "C/I (упр.)", basis: mgmt, gate: true}
  growth_cut: {max_cut_share: 0.35}  # гейт доли урезанного роста [П] [В: лист капитала — проба 0,72–0,96 уровня к потенциальному]; уточнит калибровка
  step_dividend: {max_lam_drop: 0.25}  # гейт «у ступени минимума»: допуск падения λ [П]; уточнит калибровка при сборке книги 1.0 (решение № 3, п. 15)
  cir_lt: {target: 0.47, tolerance: 0.01, from_year: 2033}  # цель C/I после фазы роста, допуск и первый год участка [В: решение № 2, §4; № 3, п. 11]
  wholesale_share: [0.08, 0.2]  # коридор доли оптового фондирования [В: лист ЧПД; якорь 0,135]; уточнит калибровка
  mix_ratio_tolerance: 0.0015  # допуск сверки норматива смеси выпуска с ожиданием нормативов клеток, доля [П] (решение ведущего № 5, п. 18)
