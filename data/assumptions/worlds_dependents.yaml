# Манифест приёма миров ставок семейства 850 — книга Т-Технологий (команда ops/tools/adopt_worlds.py).
#
# Что из версии миров копируется в дерево, какие ключи книги пишутся из индекса источника, какие числа книги
# зависят от миров и каким правилом этой книги пересчитываются, какие команды пересобирают книгу, таблицы, тексты и
# эталоны тестов. Правится руками вместе с кодом книги; на какой версии стоит книга — data/assumptions/worlds_state.json
# (пишет команда). Сторож tests/test_worlds_dependents.py: каждый лист и инструмент, читающий миры, назван здесь в
# `readers`; правила манифеста на мирах книги дают числа шаблона. Т — образец кода банков семейства: копии дерева Т
# получают манифест вместе с кодом и правят в нём только свои строки (имя книги, шаг печати, листы).
schema: worlds-dependents-v1
model: t
title: "Т-Технологии 850"
book_gen: "Т-Технологий"                 # имя книги в описании рецепта и строке 1 входов (<<book_gen>>)
print_step: 5.0                          # шаг печати медианы на витрине, ₽ (печать 310)
stop: {median_print_steps: 2}            # сдвиг медианы больше двух шагов печати — красный флаг
workers_env: [BANK_WORKERS]
workers: 2                               # общая машина: тяжёлые прогоны — два процесса
# автор коммитов --branch — из git config (почты в каталоге книги нет: tests/test_book_texts.py, гигиена)
record: data/assumptions/worlds_source.json
overlay: data/assumptions/worlds_bank.json
template: data/assumptions/assumptions_template.yaml

steps:
  # ---------------------------------------------------------------- файлы версии
  - id: record
    kind: install
    title: "запись миров {version} побайтово, рецепт, входы, описание рецепта"
    files:
      - {src: record/worlds_source.json, dst: data/assumptions/worlds_source.json}
      - {src: record/worlds_source.csv, dst: data/assumptions/worlds_source.csv}
      - {src: recipe/worlds_recipe.py, dst: data/assumptions/worlds_recipe.py}
      - src: inputs/worlds_inputs.yaml
        dst: data/assumptions/worlds_inputs.yaml
        verify: body
        keep_lines: [1]
        own_lines: {1: "# Входы записи для сборки макро-миров — книга-источник (850oa) (WORLDS-RECIPE.md); копия общей записи {record.curve_date_ru} для книги Т-Технологий (DESIGN §3.3)."}
      - {src: doc/WORLDS-RECIPE.md, dst: data/assumptions/WORLDS-RECIPE.md, verify: result, subst: {"<<book_gen>>": "{book_gen}"}}
  - id: overlay
    kind: install
    title: "надстройка банков {version}: лист сектора семейства и worlds_bank.json"
    files:
      - {src: bank/sector_sheet.yaml, dst: data/assumptions/evidence/worlds_bank/inputs/bank_overlay_draft.yaml, verify: result, keep_head: true}
      - {src: bank/worlds_bank.json, dst: data/assumptions/worlds_bank.json}
  - id: state
    kind: state
    title: "состояние: книга на мирах {version}"
  - id: recipe-check
    kind: run
    title: "рецепт воспроизводит запись {version}"
    cmd: ["{python}", "-B", "data/assumptions/worlds_recipe.py", "--check"]
  - id: overlay-check
    kind: run
    title: "сборщик надстройки воспроизводит worlds_bank.json"
    cmd: ["{python}", "-B", "data/assumptions/evidence/worlds_bank/build_overlay.py", "--check"]

  # ---------------------------------------------------------------- ключи происхождения
  - id: provenance
    kind: set
    title: "шаблон: дата кривых, происхождение и хэш записи {version}"
    file: data/assumptions/assumptions_template.yaml
    values:
      meta.curve_as_of: "{record.curve_date}"
      worlds.source.origin: "{origin}"
      worlds.source.record_asof: "{record.asof}"
      worlds.source.curve_date: "{record.curve_date}"
      worlds.source.sha256: "{record.sha256}"
    replace: {"{from.origin}": "{origin}"}   # подписи источника суждений на витрине: «[Ф: … — magnit-850oa book-1.x]»

  - id: version
    kind: rule
    title: "номер версии книги: младший разряд + 1 к версии, выпущенной на другой записи миров"
    module: ops/tools/worlds_rules.py
    function: book_version

  # ---------------------------------------------------------------- числа по правилам книги (до вывода на ядре)
  - id: paths
    kind: run
    title: "квартальные пути миров {version} → малые входы листов nii, pnl, regimes"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "paths"]
    check: ["{python}", "-B", "ops/tools/worlds_steps.py", "paths", "--check"]
  - id: spreads
    kind: rule
    title: "ключи спредов книг ЧПД: A-N1n (2026) → правило листа калибровки (2028–LT) → середина 2027 → LT оптового"
    module: ops/tools/worlds_rules.py
    function: spreads
  - id: funds-q3
    kind: rule
    title: "фактический ключ премии средств клиентов 1-го прогнозного квартала от роста М2 надстройки (A-G2)"
    module: ops/tools/worlds_rules.py
    function: funds_q3
  - id: capital-sheet
    kind: run
    title: "лист capital: калибровка и проба правила роста на секторе надстройки"
    cmd: ["{python}", "-B", "data/assumptions/evidence/capital/capital_calib.py"]
  - id: pnl-sheet
    kind: run
    title: "лист pnl: шаги 1–5 (путь пакета Яндекса на мире H)"
    cmd: ["{python}", "-B", "data/assumptions/evidence/pnl/run_all.py"]
  - id: noncore
    kind: rule
    title: "путь пакета Яндекса (A-O2) — траектория листа pnl"
    module: ops/tools/worlds_rules.py
    function: noncore

  # ---------------------------------------------------------------- вывод на ядре
  - id: build
    kind: run
    title: "машинная книга из шаблона, записи и надстройки"
    cmd: ["{python}", "-B", "data/assumptions/build_assumptions.py"]
  - id: derive
    kind: run
    title: "вывод на ядре: два запуска (у той же версии миров — повтор с записанного старта)"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "derive"]
    timeout: 5400
  - id: derived
    kind: rule
    title: "числа, выведенные на ядре: ключи, концы осей, коридор, окно фактов, справочные варианты, пометки"
    module: ops/tools/worlds_rules.py
    function: derived
  - id: build-2
    kind: run
    title: "машинная книга на выведенных числах"
    cmd: ["{python}", "-B", "data/assumptions/build_assumptions.py"]

  # ---------------------------------------------------------------- листы сверки
  - id: nii-check
    kind: run
    title: "лист nii: книги, ключи спредов, цена недостающего фондирования"
    cmd: ["{python}", "-B", "data/assumptions/evidence/nii/nii_book.py"]
  - id: pnl-check
    kind: run
    title: "лист pnl: сверка с книгой"
    cmd: ["{python}", "-B", "data/assumptions/evidence/pnl/pnl_book.py"]
  - id: capital-check
    kind: run
    title: "лист capital: сверка с книгой и записью вывода"
    cmd: ["{python}", "-B", "data/assumptions/evidence/capital/capital_book.py"]
  - id: regimes-check
    kind: run
    title: "лист regimes: пути CoR, κ"
    cmd: ["{python}", "-B", "data/assumptions/evidence/regimes/regimes_book.py"]
  - id: market-check
    kind: run
    title: "лист market: дивиденды и премии"
    cmd: ["{python}", "-B", "data/assumptions/evidence/market/dividends_book.py"]
  - id: marginal
    kind: run
    title: "лист path: рубль кредита на капитал по мирам"
    cmd: ["{python}", "-B", "data/assumptions/evidence/path/marginal_loan.py"]
  - id: refresh-check
    kind: run
    title: "запись, книга и ближние ключи спредов согласованы"
    cmd: ["{python}", "-B", "ops/tools/refresh_worlds.py", "--check"]

  # ---------------------------------------------------------------- таблицы, эталоны, тексты
  - id: quick
    kind: quick
    title: "малая полоса книги (500 прогонов, зерно книги) до и после приёма — ранняя остановка по сдвигу медианы до таблиц"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "quick", "--out", "var/adopt/quick.json"]
    out: var/adopt/quick.json
    timeout: 1800
  - id: tables
    kind: run
    title: "таблицы книги (2 000 прогонов; та же книга — без пересчёта)"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "tables"]
    timeout: 10800
  - id: table-numbers
    kind: numbers
    title: "числа книги из таблиц (2 000 прогонов): точка, медиана, печать, низ, верх, полоса — до и после приёма"
    file: data/assumptions/results.json
    fields: {point: headline.point, median: headline.median, print: headline.printed_median, low: headline.low,
             high: headline.high, band: headline.band80, printed_band: headline.printed_band80,
             implied: layers.market_implied.price, worlds.M: layers.macro_neutral.price, runs: headline.draws,
             seed: headline.seed, book_version: book_version}
  - id: gate-texts
    kind: gate_texts
    title: "объяснения сработавших гейтов: слова шаблона gate_explanations.tpl, числа — сетка и таблицы книги, книга, лист предельного кредита"
    cmd: ["{python}", "-B", "ops/tools/gate_numbers.py"]
    template: data/assumptions/gate_explanations.tpl
    file: data/assumptions/gate_explanations.yaml
    sources: {g: data/assumptions/gate_numbers.json, res: data/assumptions/results.json, book: data/assumptions/assumptions.json,
              ml: data/assumptions/evidence/path/out/marginal_loan_out.json}
    fired: {source: res, path: checks, where: {kind: gate}, flag: fired}
  - id: worlds-text
    kind: marks
    title: "числа миров и надстройки в тексте книги (A-M1…A-M3) и в справке надстройки — запись и надстройка {version}"
    sources: {rec: data/assumptions/worlds_source.json, bank: data/assumptions/worlds_bank.json,
              book: data/assumptions/assumptions.json, res: data/assumptions/results.json}
    files: [data/assumptions/ASSUMPTIONS-BOOK.md, data/assumptions/evidence/worlds_bank/README.md]
  - id: control
    kind: run
    title: "контрольная модель (вне допуска — стоп)"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "control"]
    timeout: 3600
  - id: numbers
    kind: run
    title: "числа документов (метки render_numbers)"
    cmd: ["{python}", "-B", "ops/tools/render_numbers.py"]
    check: ["{python}", "-B", "ops/tools/render_numbers.py", "--check"]
  - id: calendar
    kind: run
    title: "календарь отказов сборки: дата отказа по мирам в MANUAL §10.9 (нет — флаг)"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "calendar"]
  - id: walk
    kind: run
    title: "прогулка версий от прошлой выпущенной книги (файл шагов — из блока walk манифеста)"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "walk"]
    timeout: 3600
  - id: changes
    kind: run
    when: change
    title: "журнал версии книги V<версия>-CHANGES.md: ключи «было → стало» и прогулка"
    cmd: ["{python}", "-B", "ops/tools/worlds_steps.py", "changes"]
  - id: journal
    kind: journal
    when: change
    title: "строка версий README книги и запись CHANGELOG"
    entries:
      - file: data/assumptions/README.md
        after: "| {book.version_before} | "
        text: "| {book.version} | {today_ru} | {labels.walk_step}: миры семейства {version} приняты командой `ops/tools/adopt_worlds.py` (запись, надстройка банков, числа по правилам книги и выведенные на ядре — заново); цена и дата книги, суждения и оси — прежние; таблицы книги (2 000 прогонов): медиана {n.median_before} → {n.median_after} ₽ (печать {n.print_before} → {n.print_after}), точка {n.point_before} → {n.point_after} ₽; журнал — `V{book.version}-CHANGES.md` |"
      - file: docs/CHANGELOG.md
        after: "в её репозитории (`ML371KL/temp-zero-inode-850-sber`, файл `docs/CHANGELOG.md`)."
        text: "\n## {today_ru} — книга {book.version}: {labels.walk_step}\n\n- **Книга** `data/assumptions/` — версия {book.version} (журнал `V{book.version}-CHANGES.md`): миры семейства {version} приняты командой `ops/tools/adopt_worlds.py --version {version}` (отчёт `var/adopt/{version}/report.json`); цена и дата книги, суждения и оси — прежние. Таблицы книги (2 000 прогонов): медиана {n.median_before} → {n.median_after} ₽ (печать {n.print_before} → {n.print_after}), точка {n.point_before} → {n.point_after} ₽. Код ядра (`model/`) не менялся."
  - id: gates
    kind: gates
    title: "сработавшие гейты таблиц книги"
    file: data/assumptions/results.json
    path: checks

# Прогулка версий (ops/tools/worlds_steps.py walk): шаги — по одной причине сдвига; подстановки: {label} — подпись шага
# миров индекса (labels.walk_step), {short} — короткое имя версии миров, {book}/{prev} — книга и прошлая выпущенная
# книга, {cbr_decision_ru}, {first_quarter_ru}. Новое правило, которое двигает отдельную группу ключей, — новый шаг здесь.
walk:
  file: data/assumptions/evidence/path/inputs/walk_{prev}_to_{book}.yaml
  out: data/assumptions/evidence/path/out/walk_{prev}_to_{book}.txt
  head: "# Прогулка книги Т {prev} → {book} (миры ставок после заседания Банка России {cbr_decision_ru}): шаги ops/tools/walk_book.py, по одной причине сдвига (V{book}-CHANGES.md)."
  steps:
    - {name: "{label}: запись миров {short} — пути N/H/M, кривые, уровень кривой в терминале правилом, дата кривых", from_end: [worlds.N, worlds.H, worlds.M, worlds.source, meta.curve_as_of]}
    - {name: "{label}: ключи спредов книг на опоре и пути мира H {short} (A-N1n; с 2028 года — правило листа калибровки)", from_end: [nii.books]}
    - {name: "{label}: банковская надстройка {short} и фактический ключ премии средств {first_quarter_ru}", from_end: [worlds_bank, worlds.overlay, volumes.funds_share_drift]}
    - {name: "{label}: путь пакета Яндекса на мире H {short} (A-O2)", from_end: [noncore.result_real]}
    - {name: "{label}: числа, выведенные на ядре, концы осей и справочные варианты", from_end: [nii.phi_split, regimes.near_nim_shift, capital.n20.t2, other.misc_net_real, fees.growth_vs_wages, opex.real_growth, valuation.uncertainty.axes, valuation.reference_variants]}
    - {name: "Версия книги {book}", from_end: [meta.version]}

# Листы и инструменты, которые читают запись миров, надстройку или их копии (сторож тестов сверяет список с деревом).
# feeds — ключи шаблона из их выхода; пусто — печать или проверка.
readers:
  data/assumptions/build_assumptions.py: {feeds: ["worlds.<W>.*", "worlds_bank.<W>.*"], step: build}
  data/assumptions/worlds_recipe.py: {feeds: [], step: recipe-check}
  data/assumptions/evidence/worlds_bank/build_overlay.py: {feeds: [worlds_bank.json], step: overlay-check}
  data/assumptions/evidence/evlib.py: {feeds: [], step: ""}                  # чтение записи листами сверки
  data/assumptions/evidence/extract_inputs.py: {feeds: [], step: ""}         # малые входы из папки передачи (архив)
  data/assumptions/evidence/nii/nii_book.py: {feeds: [], step: nii-check}    # сверка ключей спредов
  data/assumptions/evidence/pnl/s1_op_basis.py: {feeds: [noncore.result_real], step: pnl-sheet}
  data/assumptions/evidence/pnl/s3_volume_cir.py: {feeds: [], step: pnl-sheet}   # LT_INFL миров — константа листа этапа 1
  data/assumptions/evidence/capital/p5_growth_trial.py: {feeds: [], step: capital-sheet}   # сектор — копия листа этапа 1; G_T — константа
  data/assumptions/evidence/market/dividends_book.py: {feeds: [], step: market-check}  # только справка премий листа этапа 1
  ops/tools/refresh_worlds.py: {feeds: [], step: refresh-check}
  ops/tools/adopt_worlds.py: {feeds: [], step: ""}
  ops/tools/worlds_rules.py: {feeds: ["nii.books.*.spread", "volumes.funds_share_drift.*.<первый квартал>", "noncore.result_real", "выведенные на ядре"], step: spreads}
  ops/tools/worlds_steps.py: {feeds: ["evidence/*/inputs/stage1/worlds/world_paths_quarterly.csv"], step: paths}
  model/payload.py: {feeds: [], step: ""}                  # печать происхождения записи на витрине (читает книгу)
