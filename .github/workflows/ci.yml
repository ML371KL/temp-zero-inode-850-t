name: Проверки модели

# Репозиторий публичный: минуты hosted-раннеров бесплатны, поэтому весь набор
# идёт на каждый push в любую ветку и на каждый PR. Коммит из одних документов
# (*.md) этот прогон не будит — его проверяет docs.yml (тесты документов,
# гигиена дерева и истории, числа документов). Данные (выпуски) живут в
# отдельном репозитории: ветки `release` здесь нет.
on:
  push:
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      future_days:
        # Прогон «в будущем»: весь набор с «сегодня» = сегодня + N дней (плагин
        # tests/fakedate_plugin.py, переменная FAKE_TODAY). Ловит тесты,
        # привязанные к дате: они остановят такт через N дней.
        description: "Прогнать тесты «в будущем»: сегодня + N дней (0 — обычный прогон)"
        required: false
        default: 0
        type: number
  schedule:
    # Раз в месяц, 1-го числа, — репетиция на полгода вперёд (future_days 180),
    # как у 850oa и «Ленты». Набор обязан быть зелёным на любой будущей дате:
    # тесты сроков данных (метка deadline) в прогон «в будущем» не входят, и
    # красным он бывает только из-за теста, привязанного к дате, — это дефект
    # теста. В публичном репозитории GitHub выключает расписание после 60 дней
    # без активности, поэтому сервер дублирует прогон: утренний такт по
    # понедельникам гоняет тесты такта с «сегодня» + 60 дней (ops/run.sh) и
    # шлёт тревогу кодом 8.
    - cron: "17 5 1 * *"

# Только чтение: секретов у CI нет, pull_request_target не используется.
permissions:
  contents: read

# Прогон «в будущем» — своя группа: иначе ежемесячный запуск по расписанию
# отменял бы идущий push-прогон (и наоборот).
concurrency:
  group: ci-${{ github.ref }}-future${{ github.event_name == 'schedule' && '180' || inputs.future_days || '0' }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  # У раннера 2 ядра: полоса неопределённости — двумя процессами (tests/conftest.py
  # держит тесты последовательными, пул — только в фикстуре parallel_band). Имя —
  # без префикса банка: его читает ядро (docs/INTERFACES.md §8).
  BANK_WORKERS: "2"

jobs:
  tests:
    # Набор разбит на три части, идущие одновременно, — каждый тест идёт РОВНО В
    # ОДНОЙ из них (сверяет tests/test_ops_ci.py):
    #   tact      — белый список сервера (TACT_TESTS в ops/run.sh) с замером
    #               времени и лёгкие сторожа дерева (гигиена истории, канон,
    #               бюджет, переводы строк, синтаксис);
    #   rest      — всё остальное, кроме файла мутаций;
    #   mutations — tests/test_core_mutations.py (самый долгий файл набора:
    #               около получаса на ноутбуке).
    # Потолки частей (`minutes`) — из ops/budgets.json (ci): время части на
    # ноутбуке × запас на раннер; вписывает `python ops/tools/budgets.py --write`,
    # руками не правятся. До первого прогона CI это оценка.
    # Раннер закреплён версией (сервер — Ubuntu 24.04); действия — по полному SHA
    # коммита (тег можно передвинуть, коммит — нет), тег — в комментарии.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      # Красная часть не отменяет остальные: журнал нужен по каждой.
      fail-fast: false
      matrix:
        include:
          - part: tact
            minutes: 20
          - part: rest
            minutes: 80
          - part: mutations
            minutes: 130
    env:
      # 0 — обычный прогон; больше нуля — прогон «в будущем» вместо обычного.
      FUTURE_DAYS: ${{ github.event_name == 'schedule' && '180' || inputs.future_days || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Вся история всех веток — для шага «Гигиена истории».
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Зависимости
        run: python -m pip install --quiet -r requirements.txt

      - name: Набор части и дата прогона
        # Выражение такта — то самое, что сервер отдаёт pytest (TACT_TESTS в
        # ops/run.sh); «остальное» — его дополнение, поэтому части не
        # пересекаются и вместе дают весь набор. Маркеры исключаются ВЫРАЖЕНИЕМ
        # и названы здесь: `network` — тесты ходят на MOEX, ЦБ и T-Invest (раннер
        # GitHub живёт вне России), `archive` — нужна папка передачи, которой на
        # раннере нет. Прогон «в будущем»: «сегодня» сдвинуто (подмена даты
        # доходит и до подпроцессов), а тесты сроков данных (deadline: объяснение
        # сработавшего гейта действует на сегодня) в набор не входят — на будущей
        # дате они красные по смыслу; срок проверяет сама сборка, о его
        # приближении сообщает плашка выпуска. Красный прогон «в будущем» —
        # тест, привязанный к дате: править тест.
        run: |
          tact=$(sed -n 's/^TACT_TESTS="\(.*\)"$/\1/p' ops/run.sh)
          [ -n "$tact" ] || { echo "::error::нет TACT_TESTS в ops/run.sh"; exit 1; }
          case "$FUTURE_DAYS" in
            ''|*[!0-9]*) echo "::error::future_days: ожидается целое число дней, получено «$FUTURE_DAYS»"; exit 2;;
          esac
          rest="not network and not archive and not ($tact)"
          if [ "$FUTURE_DAYS" != 0 ]; then
            FAKE_TODAY=$(date -u -d "+${FUTURE_DAYS} days" +%F)
            echo "FAKE_TODAY=$FAKE_TODAY" >> "$GITHUB_ENV"
            rest="$rest and not deadline"
            echo "прогон «в будущем»: FAKE_TODAY=$FAKE_TODAY (сегодня $(date -u +%F) + $FUTURE_DAYS дн)"
          fi
          echo "TACT=$tact" >> "$GITHUB_ENV"
          echo "REST=$rest" >> "$GITHUB_ENV"
          echo "часть ${{ matrix.part }}; такт: $tact; остальное: $rest"

      - name: Гигиена истории
        # Метаданные коммитов публичного репозитория видны всем и не удаляются
        # задним числом. Каждый адрес автора и коммиттера во ВСЕЙ истории всех
        # веток — из списка .github/commit-emails.allow. Нарушители печатаются
        # хэшами коммитов, без самих адресов: журнал CI тоже публичный.
        if: matrix.part == 'tact'
        run: |
          git log --all --format='%H %ae %ce' > "$RUNNER_TEMP/who.txt"
          bad=$(awk 'NR==FNR { if ($0 !~ /^#/ && NF) ok[$1] = 1; next }
                     !(($2 in ok) && ($3 in ok)) { print $1 }' .github/commit-emails.allow "$RUNNER_TEMP/who.txt")
          if [ -n "$bad" ]; then
            echo "::error::адрес автора или коммиттера вне .github/commit-emails.allow в коммитах:"
            echo "$bad"
            exit 1
          fi
          echo "коммитов: $(wc -l < "$RUNNER_TEMP/who.txt"), все адреса из списка"

      - name: Тесты такта — замер времени
        # Тот же белый список, что сервер гоняет перед сборкой, с временем
        # каждого теста; здесь он идёт один раз — часть rest его не повторяет.
        # Потолок шага — tact_tests_ci_ceiling из ops/budgets.json (300 с):
        # дольше — шаг краснеет, белый список сокращается (метка tact). Цель
        # сервера (tact_tests_target, 270 с) раннер не сверяет — её сверяет
        # замер на сервере (шаг «тесты такта» журнала такта); время дольше цели
        # здесь — предупреждение. Ноль выбранных тестов pytest возвращает кодом
        # 5 — шаг краснеет, как и такт на сервере. Тихий режим уже задан в
        # pytest.ini (-q): второй -q убрал бы итоговую строку «N passed», а
        # журнал обязан её нести.
        if: matrix.part == 'tact'
        run: |
          target=$(python -c 'import json; print(json.load(open("ops/budgets.json", encoding="utf-8"))["tact_tests_target"])')
          ceiling=$(python -c 'import json; print(json.load(open("ops/budgets.json", encoding="utf-8"))["tact_tests_ci_ceiling"])')
          echo "выражение такта: $TACT; потолок шага: $ceiling с; цель сервера: $target с"
          start=$(date +%s)
          python -m pytest -m "($TACT)" --strict-markers --durations=0 -p no:cacheprovider
          spent=$(( $(date +%s) - start ))
          echo "такт: $spent с из $ceiling (цель сервера — $target с)"
          if [ "$spent" -gt "$ceiling" ]; then
            echo "::error::тесты такта идут $spent с — дольше $ceiling с (ops/budgets.json, tact_tests_ci_ceiling)"
            exit 1
          fi
          if [ "$spent" -gt "$target" ]; then
            echo "::warning::тесты такта на раннере идут $spent с — дольше цели сервера $target с; цель сверяется замером на сервере (ops/README.md, раздел 9)"
          fi

      - name: Тесты вне набора такта
        # Всё, чего нет в белом списке сервера, кроме файла мутаций (у него своя
        # часть). `--strict-markers` не даёт завести маркер мимо pytest.ini; -rs
        # печатает причину каждого пропуска; --durations — самые долгие тесты
        # для бюджета частей (ops/budgets.json, ci).
        if: matrix.part == 'rest'
        run: python -m pytest -rs -m "$REST" --strict-markers --durations=25 --ignore=tests/test_core_mutations.py

      - name: Тест мутаций
        # Подлинное ядро проходит все проверки, каждый мутант пойман. Самый
        # долгий тест набора — отдельной частью, чтобы не держать остальные.
        if: matrix.part == 'mutations'
        run: python -m pytest -rs -m "$REST" --strict-markers --durations=5 tests/test_core_mutations.py

      - name: Канон миров, машинная книга и числа документов
        # Рецепт миров воспроизводит запись семейства; сборка — машинную книгу бит
        # в бит; числа ядра в документах равны results.json (метки render_numbers).
        if: matrix.part == 'tact' && env.FUTURE_DAYS == '0'
        run: |
          (cd data/assumptions && python -B worlds_recipe.py --check)
          python -B data/assumptions/build_assumptions.py --check
          python -B ops/tools/refresh_worlds.py --check
          python -B ops/tools/render_numbers.py --check

      - name: Бюджет тактов
        # Потолки юнитов, ожидание замка, память и потолки заданий CI равны
        # ops/budgets.json, а сам бюджет не ниже замера, на котором стоит.
        if: matrix.part == 'tact'
        run: python -B ops/tools/budgets.py --check

      - name: Переводы строк
        # Windows-редактор ставит CRLF; шелл-скрипт с CRLF на сервере не
        # запускается вовсе («bad interpreter»). Байты с -text не проверяются.
        if: matrix.part == 'tact'
        run: |
          bad=$(git ls-files --eol | grep -v 'attr/-text' | grep 'w/crlf' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi

      - name: Синтаксис скриптов и юнитов
        if: matrix.part == 'tact'
        run: |
          bash -n ops/run.sh
          for unit in ops/systemd/*.service ops/systemd/*.timer; do
            grep -q '^\[Unit\]' "$unit" || { echo "нет секции [Unit]: $unit"; exit 1; }
          done

  release-contract:
    # Настоящая сборка в памяти (`--check --fast`: мало прогонов полосы, без
    # поисков, ничего не пишет): контракт t-v1, инварианты, гейты с
    # объяснениями, защита заголовка. `--book-only` — цена, дата и реестр книги:
    # состояния сборщиков на раннере нет, а без принятой цены главного тикера
    # живая сборка по правилу М§15 не выходит. Потолок — из ops/budgets.json (ci).
    # Дата — настоящая: срок данных (истёкшее объяснение гейта, просроченный
    # ручной вход) красит задание в тот же день, в который откажет сборка на
    # сервере; календарь ближайших сроков — docs/MANUAL.md §10.9.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Зависимости
        run: python -m pip install --quiet -r requirements.txt

      - name: Контракт выпуска
        run: python -m model.build_release --check --fast --book-only
