retail_other_as_base:
  verdict: 'годится без правки: ряд «прочие розничные кредиты» прогноза ЦБ — это необеспеченные потребительские кредиты (карты и наличные); автокредиты сектора растут
    иначе, но разницу несёт премия Т по группе retail_other'
  evidence:
  - 'ряд графика прогноза ЦБ: 2022 +3 %, 2023 +16 %, 2024 +11 %, 2025 −5 % = НПС (+2,7 / +15,7 / +11,3 / −4,6 %), без автокредитов (+41,6 / +51,7 / +17,5 % за 2023–2025)'
  - у Т на 30.06.2026 авто — 33.4% группы retail_other (790.2 из 2366.5 млрд ₽), карты 39.9%, наличные и прочие 26.7%
  - 'сектор на 01.09.2026: НПС 13,0 трлн ₽ (+3,9 % г/г), автокредиты +0,6 % за август и +0,9 % за июль (≈9–10 % в годовом выражении) [обзор ЦБ за август 2026, PDF-с.
    5]'
  - если бы базой была смесь по составу Т (две трети НПС, треть авто при росте авто ≈10 %), рост базы 2026 был бы ≈7,3 % против 6,0 % — разница 1,3 п.п., внутри оси
    премии ±5 п.п.; отдельная строка сектора для авто не окупается
  caveat: 'МСБ Т (252,7 млрд ₽, +73 % за 12 мес.) и корпоративные кредиты (810,7 с лизингом) идут от строки «организации» (+9…10,5 %): премия группы corporate — самая
    высокая и самая шаткая (портфель создан покупкой Росбанка, истории два года)'
