                                                               #   книг в истории (сжатие истории 0,494 к полному сжатию φ 0,696 — 0,710), при которой гейт пола спреда
                                                               #   проходит в центре книги; пересчитывается при новом уровне маржи и новой цели передачи (лист evidence/path). Со
                                                               #   стороны средств клиентов раскладку сторожит гейт funds_cost_to_key. Ось: верх — предел гейта пола спреда при доле
                                                               #   σ0 книги; низ — наименьшая доля, при которой гейт стоимости средств клиентов ещё проходит (0,705 при пороге
                                                               #   0,706), но не ниже 0,30
  sigma0_from: 2027                                            # σ0 — ко всем значениям спредов книг с lt_shift с этого года (год якоря + 1; MODEL §4.4) [В]
  retail_current_share:                                        # доля текущих счетов в средствах физлиц: c*(key) = c_ref − psi·(key − key_ref), подстройка rho за квартал
    c_ref: anchor                                              # доля якоря 1 189,5 / 3 484,3 = 0,3414 [Ф: МСФО 6М2026, прим. 19]
