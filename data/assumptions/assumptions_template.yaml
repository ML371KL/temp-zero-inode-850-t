# ------------------------------------------------------------------ МИРЫ (A-M*) — общие с моделями семейства
worlds:
  source:                            # байтовая копия записи семейства
    record: worlds_source.json       # data/assumptions/worlds_source.json — копия бит в бит
    origin: "magnit-850oa book-1.6"  # [Ф] книга-источник записи
    record_asof: "2026-09-21"        # поле asof записи [Ф]
    curve_date: "2026-09-18"
    sha256: "7296567d5200b5599efd0989de6ed8c8461d56c5c5dda244ab7d622303969fec"   # [Ф] проверка — worlds_recipe.py --check
    recipe: [worlds_inputs.yaml, worlds_recipe.py, WORLDS-RECIPE.md]
  build:                             # блок worlds.<N|H|M> машинной книги пишет build_assumptions.py из копии (MODEL §3.1)
    script: build_assumptions.py
    fields: [key_rate, cpi, wage_growth, ofz_1y, ofz_3y, ofz_5y, ofz_10y, real_key, zero_curve, lt_inflation]
  quarter_rule: half_year_value      # квартал берёт значение своего полугодия (MODEL §0.4, правило 2)
  ids: [N, H, M]
  overlay:                           # банковская надстройка миров (MODEL §3.1, прил. B) — отдельный файл со своим хэшем
    file: worlds_bank.json           # data/assumptions/worlds_bank.json; строит evidence/worlds_bank/build_overlay.py из листа надстройки этапа 1
    sha256: null  #{{OVERLAY_SHA256}} ставит build_assumptions.py (sha256 worlds_bank.json); ядро сверяет файл с этим хэшем
    fields: [credit_growth.corporate, credit_growth.mortgage, credit_growth.retail_other, funds_growth.retail, funds_growth.corporate, nominal_gdp_growth]
    # A-M3: рост сектора по трём группам кредитов и средств клиентов. N — середины диапазонов базового сценария «Основных
    # направлений денежно-кредитной политики» (проект 30.09.2026, табл. 3.2, sha256 3c3270ef…); H и M — пересчёт по
    # инфляции мира; средства физлиц и бизнеса — денежная масса М2 (раздельных рядов нет); годы — по 2029, далее ядро
    # сводит рост к g_T мира к volumes.lt_from. Файл совпадает с надстройкой книги Сбербанка: сектор у банков один [Р].
  #{{WORLDS}}
#{{WORLDS_BANK}}

# ------------------------------------------------------------------ СОВМЕСТНЫЕ ВЕРОЯТНОСТИ (A-P*)
joint:
  world_prob: {N: 0.35, H: 0.45, M: 0.20}                # A-P1: слой «свой макро-взгляд» [Ф: общая запись сценариев ставок семейства моделей — magnit-850oa book-1.6]
  world_prob_market_implied: {N: 0.10, H: 0.25, M: 0.65} # A-P1m: слой «вменённые рынком» [Ф: запись magnit-850oa book-1.6]
  macro_neutral_world: M                                 # A-P1n: слой «рыночные ставки как есть» [Ф: запись семейства]
  own_macro_confidence: 0.5                              # A-P1c: λ, доля [Ф: запись семейства]
  regime_prob: {soft: 0.15, norm: 0.40, downturn: 0.30, crisis: 0.15}   # A-P2b: одна конвенция во всех мирах и слоях [В: Частота спокойных лет, спадов и кризисов у банка в 2014–2025 годах]
                                                         #   частоты на нынешнем составе портфеля 0,33 / 0,33 / 0,17 / 0,17; вероятность кризиса — общая
                                                         #   с книгой Сбербанка на дату книги, ось полосы 10–25 %
  reg_prob_given_regime:                                 # A-K1b: P(сценарий капитала | режим), доли [В: опоры в данных нет]; ось — смесь обратного расчёта
    soft:     {schedule: 0.35, mid: 0.45, strict: 0.20}
    norm:     {schedule: 0.35, mid: 0.45, strict: 0.20}
    downturn: {schedule: 0.35, mid: 0.45, strict: 0.20}
    crisis:   {schedule: 0.70, mid: 0.25, strict: 0.05}     # в кризисе масса смещена к «по графику»: антициклическая надбавка и макронадбавки распускаются [В]
  regime_update:                                         # A-P2u: квартальные наблюдения CoR и ЧПМ (MODEL §12)
    observables:
      cor: {sigma_pp: 0.0085, rho_q: 0.25}               # σ — стационарное с.о. отклонения CoR от пути, доли годовых [Р: шесть срезов истории 0,58–0,94 п.п.];
                                                         #   ρ за квартал [В]. Сезонной очистки нет: в 2019–2025 годах без шоков сезонности нет
      nim: {sigma_pp: 0.0035, rho_q: 0.3}                # σ [Р: 0,25–0,49 п.п.]; ρ [В: на семи кварталах не определяется]
    max_shift_pp: 0.05                                   # предел сдвига вероятности режима за одно квартальное наблюдение [В: как в книге Сбербанка]
    window_obs: 4                                        # фильтр читает четыре последних квартальных наблюдения (год отчётов) [В]
    floor_share: 0.33                                    # пол вероятности режима — после каждого наблюдения не ниже 0,33 × базовой (мягкая посадка и
                                                         #   кризис — не ниже 4,95 %): режим остаётся возможным, сколько бы отчётов «без новостей» ни прошло [В]
    shrink_by_se: true                                   # у нау-каста (se > 0) — Калман со сжатием
    observations: []                                     # [{period: "2026Q3", cor: 0.047, nim: 0.114, se_cor: 0.0, se_nim: 0.0, basis: engine}] — наблюдения
                                                         #   вносятся в БАЗИСЕ ДВИЖКА (решение ведущего № 4, п. 12): рябь счёта дней в упр. ЧПМ (до ±0,15 п.п.)
                                                         #   в обучение не попадает; у наблюдений квартала не позже якоря — ещё mu_cor, mu_nim (пишет
                                                         #   перезаякоривание, MODEL §15.2)

# ------------------------------------------------------------------ РЕЖИМЫ ДОХОДНОСТИ И РОЗНИЧНОГО КРЕДИТНОГО ЦИКЛА (A-C*b)
# CoR режимов — УПРАВЛЕНЧЕСКИЙ базис (cor_basis: mgmt): ядро переводит пути мостом to_engine_cor (MODEL §4.6; факт
# bridge_mgmt_ifrs.cor ≈ −0,0025). Пути — лист режимов этапа 1 (история банка с 2014 года в пересчёте на нынешний
# состав портфеля), решение ведущего № 2, §8. Пути и уровни стоят в мире M — «Рыночный как есть» (credit.kappa_reference_world): окно фактов
# прошло при его ставках. Взвешенный LT-CoR 5,61 % упр. в мире M; в мирах с меньшей реальной ставкой уровень ниже на
# κ × разность реальных ставок. Ключ "2026" действует на 3-й и 4-й кварталы 2026 года.
# Ближний сдвиг ЧПМ — отдельная траектория near_nim_shift, общая для всех режимов и миров (MODEL §3.2, A-C4b);
# nim_shift режимов несёт только сдвиг самого режима (ключ "2026" — 0 у всех); взвешенный по режимам LT-сдвиг −0,03 п.п.
regimes:
  ids: [soft, norm, downturn, crisis]
  cor_basis: mgmt                    # базис путей cor: mgmt (перевод to_engine_cor в ядре) | engine
  near_nim_shift: {"2026Q3": -0.0064, "2026Q4": -0.01359, "2026": -0.009995, "2027Q1": -0.01315, "2027Q2": -0.01355, "2027Q3": -0.0121, "2027Q4": -0.01118, "2027": -0.012495, "2028Q1": -0.00831, "2028Q2": -0.00793, "2028Q3": -0.00679, "2028Q4": -0.00583, "2028": -0.007215, "2029Q1": -0.00545, "2029Q2": -0.00438, "2029Q3": -0.00275, "2029Q4": -0.00116, "2029": -0.003435, LT: 0.0, LT_from: 2030}
                                     # A-C4b, базис движка; ключ года = среднее кварталов (MODEL §0.4) [Р: Расчёт: путь маржи от 11,6 % во 2 кв. 2026 года к уровню после фазы роста]
                                     #   ВЫВЕДЕНО НА ЯДРЕ 09.10.2026 — лист evidence/path; число ЗАМОРОЖЕНО (оси, обратный расчёт, «цена правила», справочные
                                     #   варианты и сравнение версий его не пересчитывают). Только ближний путь: с 2030 года — 0. 3-й и 4-й кварталы 2026 года — путь книги 11,53
                                     #   и 11,48 % упр.: месячные формы банка за июль–август 2026 года дают маржу на уровне 2-го квартала, механика книг дала
                                     #   бы больше. Ключи 2027–2029 — прямая от уровня 4-го квартала 2026 года к марже, которую модальная клетка печатает в
                                     #   1-м квартале 2030 года без сдвига; ступени на стыке нет. Ось — сдвиг ключей 2027–2029
  soft:
    name: "Мягкая посадка"
    cor: {"2026": 0.046, "2027": 0.041, "2028": 0.040, "2029": 0.044, LT: 0.048, LT_from: 2030}   # A-C0b, A-C1b [Р: Стоимость риска за 4 кв. 2024 — 2 кв. 2026 и история на нынешнем портфеле]
                                                                                                 #   ось — сдвиг LT всех режимов −0,9…+1,2 п.п.
    nim_shift: {"2026": 0.0, "2027": 0.001, LT: 0.002, LT_from: 2029}                          # A-C3b: +0,1 п.п. в 2027, LT +0,2 п.п. [В]
    loan_growth_adj: {"2026": 0.0, "2027": 0.02, "2028": 0.02, LT: 0.0, LT_from: 2029}         # A-C5b: +2 п.п. к потенциальному росту в 2027–2028 [В: по спросу и одобрению заявок]
  norm:
    name: "Нормализация"
    cor: {"2026": 0.049, "2027": 0.050, "2028": 0.052, "2029": 0.054, LT: 0.055, LT_from: 2030}   # [Р/В: лист режимов; LT 5,5 % — уровень окна 4 кв. 2024 — 2 кв. 2026 в мире M]
    nim_shift: {"2026": 0.0, LT: 0.0}                                                            # база; LT 0
    loan_growth_adj: {LT: 0.0}
  downturn:
    name: "Розничный спад"
    cor: {"2026": 0.054, "2027": 0.069, "2027Q1": 0.062, "2027Q2": 0.068, "2027Q3": 0.072, "2027Q4": 0.074, "2028": 0.063, "2029": 0.059, LT: 0.059, LT_from: 2030}
                                                                                                 # профиль 2027 — признание растянуто по кварталам [Р: Стоимость риска 2020 и 2022 годов в пересчёте на нынешний портфель: 6,3–7,9 %]
                                                                                                 #   ось — сдвиг ключей 2027 года −0,6…+1,0 п.п.
    nim_shift: {"2026": 0.0, "2027": -0.002, "2028": -0.002, LT: -0.001, LT_from: 2029}         # −0,2 п.п. в 2027–2028, LT −0,1 п.п. [В]
    loan_growth_adj: {"2026": 0.0, "2027": -0.03, "2028": -0.03, LT: 0.0, LT_from: 2029}        # −3 п.п. к потенциальному росту [В: по спросу, не по фактическому росту портфеля в стрессы]
  crisis:
    name: "Кризис"
    cor: {"2026": 0.054, "2027": 0.100, "2027Q1": 0.130, "2027Q2": 0.105, "2027Q3": 0.088, "2027Q4": 0.077, "2028": 0.072, "2029": 0.060, LT: 0.061, LT_from: 2030}
                                                                                                 # профиль МСФО 9 — пик в квартале шока [Р: Стоимость риска 2014–2015 годов в пересчёте на нынешний портфель: 9,5–12,4 %]
                                                                                                 #   ось — сдвиг ключей 2027 года −0,5…+2,4 п.п.
    nim_shift: {"2026": 0.0, "2027": -0.005, LT: -0.002, LT_from: 2028}                        # −0,5 п.п. в 2027, LT −0,2 п.п. [В: Падение маржи банка в шоки 2020 и 2022 годов сверх эффекта ставки]
                                                                                                 #   ось 2027: 0…−1,2 п.п.
    loan_growth_adj: {"2026": 0.0, "2027": 0.0, "2028": 0.0, "2029": 0.02, LT: 0.0, LT_from: 2030}   # 2027–2028 заменяет override; +2 п.п. в 2029 [В: лист режимов]
    loan_growth_override: {"2027": 0.03, "2028": 0.06}         # абсолютный рост кредита [Р: рисковый сценарий Банка России −5…0 и −1…+4 %; у Т рост выше сектора]
    one_off_loss: {period: "2027Q1", amount: -40.0}            # A-C6b: разовый убыток до налога ≈5 % капитала [В: Разовые убытки банка в 2014, 2015 и 2022 годах — до 13 % капитала]
                                                               #   2014 — 5,4 %, 2015 — 1,0 %, 2022 — 13,1 % капитала; ось 0…−100
    shock_year_offset: 1                                       # год шока = год якоря + 1 (2027): отменяются решения о дивиденде, принимаемые в этом году;
                                                               #   кризисные ключи (профиль cor, период one_off_loss, первый год override, минимум множителя RWA)
                                                               #   лежат в году шока и при перезаякоривании сдвигаются с якорем [В]
    rwa_density_mult: {"2026": 1.0, "2027": 0.90, LT: 1.0, LT_from: 2030}   # A-K14: множитель RWA клеток режима — роспуск макронадбавок [В: Надбавки Банка России — 19 % взвешенных активов банка; роспуск половины]
                                                               #   0,90 в год шока, линейно к 1 к 2030 году; ключ "2026" обязателен (иначе 0,90 получит и 2-е полугодие
                                                               #   2026 года); ось — значение 2027 года 0,81…1,00: от роспуска всех надбавок до его отсутствия

credit:                                                        # резервы (MODEL §4.6); CoR движка = резервы / средние остатки шести кредитных книг (3 813,1 на якоре)
  kappa: 0.10                                                  # A-C2b: доля CoR на долю разности реальных ставок мира и мира-опоры [Р/В: Связь стоимости риска с реальной ставкой в 2014–2026 годах, без кварталов шока]
                                                               #   регрессии без кварталов шока +0,07…+0,18; ось 0–0,30: на оси меняются миры N и H, мир-опора стоит на уровне окна
  kappa_reference_world: M                                     # A-C0b: мир, в котором стоят пути и уровни CoR режимов (MODEL §4.6): уровень, взятый из окна фактов, стоит в том
                                                               #   мире, условиям которого окно отвечает, — окно 4 кв. 2024 — 2 кв. 2026 прошло при ключевой ставке 14,6–21 %, это мир
                                                               #   «Рыночный как есть». Добавка κ — к нему, любого знака: в мирах N и H уровень режима ниже на κ × разность
                                                               #   реальных ставок [В]
  real_rate_lag_q: 2                                           # L, кварталов [В: подгонка лучше при лаге 0–2]
  segment_relative: {enabled: false, corporate: null, retail: null}   # сегментная CoR выключена: у кредитов МСБ рост — с сектором бизнеса, риск — розничный
  fv_loans_factor: 0                                           # A-C9: строка переоценки кредитов по справедливой стоимости выключена: таких кредитов 5,3 млрд ₽,
                                                               #   они лежат в книге корпоративных кредитов без отдельной механики
  fv_loans_ref: norm                                           # режим-опора строки переоценки; при множителе 0 не читается
  allowance_ratio: anchor                                      # резерв / валовые кредиты — как на якоре: 353,4 / 3 813,1 = 0,0927 [Ф: МСФО 6М2026, прим. 17]

# ------------------------------------------------------------------ ЧПД: КНИГИ СО СПРЕДОМ И ЛАГОМ (A-N*)
# 12 книг: шесть кредитных по раскрытым продуктам, долговые бумаги, ликвидность, две книги средств физлиц, средства
# бизнеса, оптовое фондирование. Остатки и ставки якоря — прямыми узлами фактов (balance.json, nii_books.json):
# проценты квартала / средний остаток по примечаниям отчётности; проценты двенадцати книг минус взносы в систему
# страхования вкладов плюс проценты вне книг дают ЧПД квартала якоря 157,6 млрд ₽ [Р: evidence/nii].
# spread — траектория спреда к ref в мире H (s_b^H), доли; у активов в форме движка s − (1 − a)·ref_H(q) — наклон истории a < 1
# перенесён в траекторию; rho — доля подстройки за квартал; beta — передача ключевой в ставку пассива.
# phi — книга несёт сжатие φ (MODEL §4.4–§4.5): у кредитных книг сжимается спред к опоре (φ_A), у средств клиентов
# дорожает фондирование; долю кредитных книг задаёт nii.phi_split (A-N8). lt_shift — книга несёт сдвиг σ0 (MODEL §4.5):
# активы +σ0_A, пассивы −σ0_L — ко всем значениям спреда с года sigma0_from; долю активов задаёт nii.sigma0_split (A-N7).
# Ближние ключи траекторий спреда (A-N1n, MODEL §4.4) — от ставок якоря: "2026" = ставка якоря − опора мира H в 3-м квартале
# 2026 года; "2027" — середина между "2026" и калибровкой 2028 года; с 2028 года — калибровка истории [Р: evidence/nii].
# Проценты по долгу нефинансовых компаний группы (в том числе под пакет Яндекса) — в книге оптового фондирования и в ЧПД;
# пакета Яндекса в долговых бумагах нет: он в постоянных прочих активах (volumes.other_assets_fixed).
nii:
  books:
    cards:          {name: "Кредитные карты", side: asset, ref: key, rho: 0.10, spread: {"2026": 0.17969, "2027": 0.1859, "2028": 0.19211, "2029": 0.20061, "2030": 0.20592, LT: 0.21123, LT_from: 2031}, phi: true, lt_shift: true, sector: retail_other, cor_segment: retail}
                    # ставка якоря 31,969 %; окно 4 кв. 2024 — 2 кв. 2026; наклон к ключевой 0,15 [В]; ρ 95 % 0,05–0,52 [Р: evidence/nii]
    cash_loans:     {name: "Кредиты наличными", side: asset, ref: ofz_3y, rho: 0.18, spread: {"2026": 0.1172, "2027": 0.12519, "2028": 0.13318, "2029": 0.13318, "2030": 0.13318, LT: 0.13318, LT_from: 2031}, phi: true, lt_shift: true, sector: retail_other, cor_segment: retail}
                    # ставка якоря 27,680 %; ряды эмитента 4 кв. 2018 — 4 кв. 2025; ρ 95 % 0,13–0,24 [Р: evidence/nii]
    auto:           {name: "Автокредиты", side: asset, ref: ofz_3y, rho: 0.34, spread: {"2026": 0.03275, "2027": 0.03717, "2028": 0.04158, "2029": 0.04188, "2030": 0.04205, LT: 0.04224, LT_from: 2031}, phi: false, lt_shift: false, sector: retail_other, cor_segment: retail}
                    # ставка якоря 19,235 %; ряды эмитента 1 кв. 2019 — 4 кв. 2025; спред — у пола, сдвига и сжатия не несёт [Р: evidence/nii]
    mortgage:       {name: "Ипотека", side: asset, ref: ofz_3y, rho: 0.30, spread: {"2026": 0.01296, "2027": 0.01471, "2028": 0.01645, "2029": 0.01941, "2030": 0.02115, LT: 0.02304, LT_from: 2031}, phi: false, lt_shift: false, sector: mortgage, cor_segment: retail}
                    # ставка якоря 17,256 %; окно 4 кв. 2024 — 2 кв. 2026; наклон 0,70 [В]; льготная ипотека отдельно не раскрыта [Р: evidence/nii]
    sme_loans:      {name: "Кредиты МСБ", side: asset, ref: ofz_1y, rho: 0.40, spread: {"2026": 0.27004, "2027": 0.26599, "2028": 0.26194, "2029": 0.26598, "2030": 0.26868, LT: 0.27086, LT_from: 2031}, phi: true, lt_shift: true, sector: corporate, cor_segment: retail}
                    # ставка якоря 40,964 %; окно; наклон 0,60 [В]; рост — с сектором бизнеса, риск — розничный [Р: evidence/nii]
    corp_loans:     {name: "Корпоративные кредиты и лизинг", side: asset, ref: key, rho: 0.78, spread: {"2026": 0.00929, "2027": 0.00991, "2028": 0.01054, "2029": 0.01054, "2030": 0.01054, LT: 0.01054, LT_from: 2031}, phi: false, lt_shift: false, sector: corporate, cor_segment: corporate}
                    # корпоративные 732,9 + лизинг 77,8 + кредиты по справедливой стоимости 5,3; ставка якоря 14,929 %; уровень спреда
                    #   +1,05 п.п., ст. ош. 0,38 [Р: evidence/nii]
    securities:     {name: "Долговые бумаги", side: asset, ref: ofz_1y, rho: 0.18, spread: {"2026": -0.02354, "2027": -0.01936, "2028": -0.01519, "2029": -0.01175, "2030": -0.00946, LT: -0.00761, LT_from: 2031}, phi: false, lt_shift: false, balancing: true}
                    # только долговые бумаги (745,8); ставка якоря 11,606 %; ряды эмитента 2016–2025 [Р: evidence/nii]; акции и паи (56,8) — в прочих активах
    liquidity:      {name: "Ликвидность", side: asset, ref: key, rho: 1.0, spread: {"2026": -0.0058, "2027": -0.01049, "2028": -0.01519, "2029": -0.01319, "2030": -0.01194, LT: -0.01069, LT_from: 2031}, phi: false, lt_shift: false, balancing: true}
                    # деньги, счета в Банке России, обязательные резервы, средства в банках и обратное репо (1 073,5); ставка якоря 13,420 % [Р: evidence/nii]
    retail_current: {name: "Текущие счета физлиц", side: liability, ref: key, rho: 0.85, beta: 0.24, spread: 0.02239, phi: true, lt_shift: true}   # ставка якоря 5,684 %; ряды эмитента 2020–2025 [Р: evidence/nii]
    retail_term:    {name: "Срочные вклады физлиц", side: liability, ref: key, rho: 0.55, beta: 1.0, spread: -0.02155, phi: true, lt_shift: true}   # ставка якоря 13,134 %; ρ 95 % 0,41–0,71 [Р: evidence/nii]
    corp_funds:     {name: "Средства бизнеса", side: liability, ref: key, rho: 0.45, beta: 0.50, spread: -0.01738, phi: true, lt_shift: true}       # ставка якоря 6,596 %; бета — суждение [В]
                    # три книги средств клиентов несут свою долю сдвига σ0 (A-N7) и сжатия φ (A-N8) одним значением; у обеих книг средств
                    #   физлиц оба флага одинаковы — сдвиг не входит в передачу, объём сжатия не зависит от раскладки
    wholesale:      {name: "Оптовое фондирование", side: liability, ref: key, rho: 1.0, beta: 1.0, spread: {"2026": -0.03199, "2027": -0.01739, LT: -0.00279, LT_from: 2028}, phi: false, lt_shift: false, balancing: true}
                    # банки 184,8, прочие заёмные 170,9, долг нефинансовых компаний 249,9, бессрочные субординированные 65,7 [Р: Срочные вклады в 2024–2026 годах стоили на 0,79 п.п. дороже ликвидных активов]
                    #   ставка якоря 10,801 %: в ней льготные займы акционеров (8,3 % при ключевой 15,2 %); LT-спред льготу не продлевает.
                    #   Книга несёт и недостающее фондирование клетки — рыночные займы и вклады по рыночной ставке. Правило LT-спреда:
                    #   LT-спред книги ликвидности (−1,069 п.п. к ключевой) плюс 0,79 п.п. — на столько срочные вклады физлиц в среднем
                    #   за окно 4 кв. 2024 — 2 кв. 2026 стоили дороже доходности ликвидных активов (панель ставок, лист evidence/nii):
                    #   −0,279 п.п. к ключевой; занять на рынке и разместить в ликвидные активы клетке не выгодно. Ключ 2027 года —
                    #   середина между ключом 2026 года и LT. Ось LT-спреда −1,5…+1,5 п.п. к ключевой: низ — фондирование на полтора
                    #   пункта дешевле ключевой, верх — облигационный уровень
  transmission:                                                # явный ключ передачи ставки (MODEL §4.5)
    target: 0.06                                               # A-N3: РЕАЛИЗОВАННАЯ передача [Nss(M) − Nss(N)] / (key_M^LT − key_N^LT), доля на долю
                                                               #   [В: Суждение книги: середина свидетельств о передаче ставки в маржу, 0…+0,12]
                                                               #   правило центра — середина диапазона свидетельств. Ноль: история эмитента знака не определяет (ближние эпизоды
                                                               #   −0,09…−0,29, раскрытая чувствительность — у нуля). +0,12: структурная оценка на балансе якоря (на рубль процентных
                                                               #   активов активы несут 0,75 изменения ставки, пассивы — 0,63). +0,06 — и цель книги-образца семейства. Уровень маржи
                                                               #   стоит в мире «Рыночный как есть» (level_world), передача переносит его в миры с меньшей ставкой: чем она больше, тем
                                                               #   ниже маржа миров N и H и оценка. Правило середины от знака этого влияния не зависит. Ближняя передача — механикой
                                                               #   книг. Ось — сам диапазон свидетельств 0,00…+0,12: решатель решает цель на всей оси, мир уровня на ней неподвижен
                                                               #   (лист evidence/path)
    reference_world: H                                         # мир, в котором заданы спреды s_b^H и решается σ0 (сжатие φ в нём равно нулю)
    level_world: M                                             # A-N2: мир уровня — «Рыночный как есть»: ключ цели маржи nim_lt_target_mgmt задаёт стационарную маржу
                                                               #   этого мира на составе баланса якоря; уровень мира-опоры H решатель передачи находит сам (MODEL §4.5)
    fd_step: 0.01                                              # шаг параллельного сдвига ставок для локальной T(W) (диагностика), доля
    weights: anchor                                            # веса книг стационарного ЧПМ — состав баланса якоря: уровень маржи задан на составе баланса
                                                               #   якоря, при росте доли кредитов печатаемая маржа выше (решение ведущего № 4, п. 1)
  nim_lt_target_mgmt: 0.111                                    # A-N2: стационарная маржа при рыночных ставках (мир M) на составе баланса якоря, упр. базис [Р/В: Средняя маржа за 4 кв. 2024 — 2 кв. 2026, приведённая к балансу якоря]
                                                               #   ключ — само суждение книги: уровень, взятый из окна фактов, стоит в том мире, условиям которого окно отвечает
                                                               #   (мир уровня — nii.transmission.level_world). Правило центра: средняя семи кварталов окна 10,75 %, приведённая к
                                                               #   составу баланса якоря, — +0,11 п.п. маржи на пункт доли кредитов в процентных активах по определению эмитента,
                                                               #   64,5 → 67,9 % (лист evidence/nii); средняя четырёх последних кварталов — 11,0 % при доле кредитов 65,9 %. Маржа,
