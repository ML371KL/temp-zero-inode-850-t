equity:
  other_movements: {LT: 0.0}                                   # прочие движения капитала, млрд ₽ за квартал [В: центр 0]: за четыре квартала резерв выплат акциями
                                                               #   +15,41 и выкуп под программу мотивации −14,03 взаимно гасятся (ограничение книги)

# ------------------------------------------------------------------ КАПИТАЛ И НОРМАТИВЫ (A-K*b)
# Оба норматива — фактические нормативы банковской группы (Банк России, форма 0409805; головная организация — АО «ТБанк»):
# слот n20_0 — Н20.0, слот n1_1 (n11) — Н20.1. Форма ядра — аддитивные вычеты из капитала акционеров МСФО, растущие с RWA
# (MODEL §4.11): на якоре даёт Н20.0 12,93 % и Н20.1 9,40 % — как в форме. Мост стоит на допущении «капитал вне периметра
# банковской группы свободно перекладывается в банк»; отчётный Н20.1 форма ошибается на ±0,3 п.п. по сезону и до 0,9 п.п.
# в квартал присоединения Росбанка — оценку это не меняет: связывает Н20.0 (ограничения книги) [Р: evidence/capital].
capital:
  minimum: {n20_0: 0.08, n1_1: 0.045}                          # A-K4b: минимум Н20.0 и Н20.1 банковской группы [Ф: Инструкция Банка России 220-И, п. 2.2]
  mgmt_buffer: {n20_0: 0.015, n1_1: 0.015}                     # A-K10b: запас менеджмента над минимумом сценария, к обоим нормативам [В: Суждение: запас норматива над минимумом Банка России в 2025–2026 годах]
                                                               #   три чтения ряда формы 0409805 (шесть дат): над действующим минимумом +2,6…+3,2 п.п.; над минимумом 2028 года
                                                               #   −0,35…+1,0; над требованием с глиссадой при запасе 0 +2,2…+3,2. Запас книги — СВЕРХ глиссады (заблаговременный
                                                               #   набор капитала перед ступенями — capital.growth_constraint); ось 0,5…2,5 п.п., одна на оба норматива
  reg_scenarios:                                               # A-K2b: надбавки по годам (с 1 января), доли RWA [Ф: 220-И, пп. 3.2, 3.4; решения Банка России 08.11.2024 и 27.07.2026]
    ids: [schedule, mid, strict]                               # надбавка за системную значимость после 2028 года: 1,0 % / 1,5 % («средняя группа») / 2,0 % и вычет [В: доклады
                                                               #   Банка России 22.05.2025 и 20.02.2026; целевой уровень антициклической надбавки 1 %]
    schedule:
      name: "По графику"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010}
      ccyb: {LT: 0.005}                                        # антициклическая надбавка 0,5 % с 01.07.2025 [Ф]
      deduction_pp:                                            # вычеты, доли норматива
        n20_0: {LT: 0.0}
        n1_1: {LT: 0.0}
    mid:
      name: "Средняя группа СЗКО"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010, LT: 0.015, LT_from: 2029}
      ccyb: {"2027": 0.005, LT: 0.010, LT_from: 2028}
      deduction_pp:
        n20_0: {LT: 0.0}
        n1_1: {LT: 0.0}
    strict:
      name: "Жёсткий"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010, "2029": 0.015, LT: 0.020, LT_from: 2030}
      ccyb: {"2027": 0.005, LT: 0.010, LT_from: 2028}
      deduction_pp:                                            # A-K3b: вычет 0,3 п.п. с 2028 года [В: Суждение: вычеты консолидации и иммобилизованных активов с 2028 года]
                                                               #   ось — значение LT двух путей 0…0,6 п.п.
        n20_0: {"2027": 0.0, LT: 0.003, LT_from: 2028}
        n1_1: {"2027": 0.0, LT: 0.003, LT_from: 2028}
    # Пол Н20.0 = 8 % + надбавки: 10,0 (2026) → 10,75 (2027) → 12,0 / 12,5 / 12,5 (2028) → 12,0 / 13,0 / 13,0 (2029) → 12,0 / 13,0 / 13,5 (с 2030);
    #   пол Н20.1 = 4,5 % + те же надбавки: 6,5 → 7,25 → 8,5 / 9,0 / 9,0 → 8,5 / 9,5 / 9,5 → 8,5 / 9,5 / 10,0 [Р: evidence/regulation].
  n20:                                                         # Н20.0 группы из BV — аддитивные вычеты, растущие с RWA (MODEL §4.11)
    deductions_anchor: 197.990                                 # A-K5b: Ded20_0 = (капитал акционеров 756,8 + непризнаваемая часть фонда FVOCI 0,36 × 4,6) − (базовый + дополнительный
                                                               #   капитал группы 560,466) [Р: МСФО 6М2026, с. 6; форма 0409805]; = 3,74 % RWA; числом, а не формулой anchor
    fvoci_recognition: 0.64                                    # A-K7b: доля фонда FVOCI, признаваемая в нормативе [В: Доля ОФЗ в облигациях, оцениваемых через совокупный доход, на 30.06.2026]
                                                               #   214,2 / 333,0; состав фонда не раскрыт; ось 50–80 %
    t2: {"2026Q2": 123.182, "2026Q3": 128.6, "2026Q4": 134.7, "2027Q1": 141.5, "2027Q2": 144.8, "2027Q3": 149.7, "2027Q4": 154.2, "2028Q1": 157.8, "2028Q2": 163.8, "2028Q3": 172.0, "2028Q4": 177.5, "2029Q1": 181.5, "2029Q2": 188.4, "2029Q3": 196.7, "2029Q4": 205.2, "2030Q1": 212.5, "2030Q2": 220.1, "2030Q3": 227.9, "2030Q4": 236.1, "2031Q1": 242.5, "2031Q2": 249.2, "2031Q3": 256.0, "2031Q4": 263.1, "2032Q1": 268.1, "2032Q2": 273.2, "2032Q3": 278.4, "2032Q4": 283.8, "2033Q1": 288.7, "2033Q2": 293.6, "2033Q3": 298.7, "2033Q4": 303.9, "2034Q1": 309.1, "2034Q2": 314.4, "2034Q3": 319.9, "2034Q4": 325.4, "2035Q1": 331.0, "2035Q2": 336.7, "2035Q3": 342.5, "2035Q4": 348.4, "2036": 363.7, LT: 363.7}
                                                               # A-K8b: регуляторные инструменты группы без прибыли, млрд ₽ [Ф/В: Добавочный капитал банковской группы по форме Банка России на 01.07.2026]
                                                               #   ВЫВЕДЕНО НА ЯДРЕ 09.10.2026 — лист evidence/path; числа ЗАМОРОЖЕНЫ: траектория в рублях, которая держит долю якоря
                                                               #   2,33 % RWA модальной клетки (123,182 / 5 287,3; шесть дат формы 0409805 — 2,2–2,5 % RWA): инструменты растут вместе
                                                               #   с RWA — при связывающем Н20.0 и свободном Н20.1 банку дешевле выпустить инструмент, чем урезать рост. Внешняя доля
                                                               #   прироста стоит дороже оптового фондирования: её стоимость — в траектории other.misc_net_real (A-O3). Ключ квартала
                                                               #   якоря — факт 123,182 (строка якоря воспроизводит Н20.0); квартальные ключи — по концам кварталов, 2036 год — среднее
                                                               #   года. Право отзыва бессрочного займа на 600 млн долларов с 20.12.2026 — событие календаря; ось — сдвиг пути
                                                               #   ±37 млрд ₽ (±0,7 п.п. RWA якоря)
    gap_pp: 0.0                                                # A-K6b: «Н20.0 − расчёт» на якоре: 0 по построению [Р: Норматив Н20.0 на 30.06.2026 против расчёта; ошибка на пяти датах 0,24 п.п.]
                                                               #   ось ±0,3 п.п.; приёмка формы — годовой итог в пределах 0,25 п.п.
  n11:                                                         # Н20.1 группы (MODEL §4.11; слот n1_1)
    deductions_anchor: 168.895                                 # Ded11_0 = 758,456 − прибыль 1П2026 98,589 − базовый капитал группы 490,971 [Р: форма 0409805; МСФО 6М2026]
    gap_pp: 0.00114                                            # Н20.1 − базовый / RWA(Н20.0): знаменатели двух нормативов различаются на 64 млрд ₽ [Р: форма 0409805]
    audit_cutoffs: [3, 4]                                      # A-K9b: кварталы, прибыль по которые входит в базовый капитал после аудита: 9 месяцев — с формы на 01.12,
                                                               #   год — с 01.04 [Ф: форма 0409123 банка: ступени +56,1 и +32,9 млрд ₽]
  rwa:
    density: {cards: 1.7784, cash_loans: 1.7784, auto: 1.3493, mortgage: 0.6389, sme_loans: 0.4991, corp_loans: 0.4698, securities: 0.0993, liquidity: 0.0298, other_assets: 0.7121, other_assets_fixed: 0.0}
                                                               # A-K11b: RWA группы / остаток книги МСФО; сумма = вменённые RWA группы 5 287,3 млрд ₽ [Р/В: разбивка RWA банка по видам
                                                               #   риска × 0,9929, презентация 2 кв. 2026, с. 20]; розница — 145 % ссуд физлиц с надбавками; у постоянных прочих
                                                               #   активов (пакет Яндекса, вложения вне банковской группы) — 0
    density_drift_rate: 0.010                                  # рост плотности, доля в год [В: Суждение: ступени операционного риска против снижения надбавок Банка России]
                                                               #   ступень операционного риска 4-го квартала идёт плавным дрейфом, не квартальными ключами (ступень 4-го квартала
                                                               #   2026 года, около −0,5 п.п. Н20.0, — строка ограничений и событие календаря); ось −4,0…+3,5 % в год
    density_drift_until: 2027                                  # последний год дрейфа [В: к концу 2027 года индекс плотности выходит на +1,5 %]
    fx: {enabled: false, share: null, foreign_inflation: null} # валютная переоценка RWA выключена: курса в мирах нет, валютная доля RWA не раскрыта [В]
  recapitalization: {enabled: false}                           # докапитализация и размывание — выключено
  growth_constraint:                                           # A-K13: рост, ограниченный капиталом (MODEL §4.13) — суждение о поведении менеджмента с ноября 2024 года [В]
    enabled: true                                              # цена правила печатается тремя книгами: без ограничения, «сначала дивиденд», «сначала рост»
    order: dividend_first                                      # дивиденд платится по политике; при нехватке капитала первым уступает рост кредитных книг
    min_growth_scale: 0                                        # нижняя граница доли потенциального прироста: портфель не сжимается
    lookahead_quarters: 8                                      # на сколько кварталов вперёд видны ступени минимума
    glide_pp_per_quarter: 0.0025                               # глиссада: сколько требования набирается за квартал перед ступенью (0,25 п.п.) [В: при 0 требование нарушено
                                                               #   уже на якоре, при 0,5 п.п. — срез дивиденда]
    catch_up_rate: 0.0                                         # доля разрыва с потенциальным путём, навёрстываемая за год [В]: 0 — свойство метода книги: без памяти о
                                                               #   разрыве доля прироста квартала зависит только от состояния, и перенос якоря «факт = ожидание» точен во всех
                                                               #   клетках; оси нет, цена ненулевого навёрстывания — справочным вариантом (valuation.reference_variants)
    tol: 0.0001                                                # допуск равенства норматива требованию (1 б.п.)

# ------------------------------------------------------------------ ДИВИДЕНДЫ — ПОЛИТИКА ДАННЫМИ (A-D*)
dividends:
  policy:                                                      # A-D1 [Ф: дивидендная политика эмитента, редакция 2, с. 4–5, sha256 d0cfc69b…]: решение — ежеквартально,
                                                               #   «до 30 % чистой прибыли по итогам года» по МСФО
    name: "Положение о дивидендной политике МКПАО „Т-Технологии“ (редакция 2, совет директоров 20.03.2025)"
    base: ifrs_ni_shareholders                                 # база: прибыль акционеров строки движка — у Т это операционная прибыль акционеров (определение эмитента)
    deduct_at1_after_tax: false                                # бессрочных инструментов в капитале МСФО нет (65,7 млрд ₽ — в обязательствах)
    payout: {LT: 0.26}                                         # доля по году прибыли к средней операционной прибыли четырёх кварталов [Р: факт шести решений 24,4–27,7 %, среднее 25,86 %]
    metric: n20_0                                              # норматив условия
    threshold: 0.0                                             # порога норматива в политике нет; требование = пол сценария + запас менеджмента
    steps: []                                                  # ступеней нет (в квартальном режиме непустой список — отказ)
    shortfall_rule: residual_above_requirement                 # не хватает капитала и при нулевом росте — остаток сверх требований
    divisor: issued                                            # DPS = пул / размещённые акции [Ф: 2 682,74786 млн после дробления 1:10]
    dps_rounding: half_up_kopeck                               # обязательный ключ схемы; при тесте истории cap не читается
    forecast_rounding: none                                    # прогнозный DPS не округляется (гладкость поисков)
    history_test: cap                                          # A-D7: тест истории — выплаты завершённого года не выше потолка политики (формулы «до копейки» у эмитента нет)
    cap: 0.30                                                  # потолок выплат года к отчётной прибыли акционеров МСФО [Ф: политика, с. 4]; 2024 год — 27,3 %, 2025 год — 22,6 %;
                                                               #   тот же потолок читает гейт выплаты года по политике; клетка потолок не применяет
    base_window_quarters: 4                                    # база пула — средняя прибыль четырёх последних кварталов [Р: разброс доли к этой базе 1,2 п.п. против 2,1 к кварталу]
  payout_deviation: {LT: 0.0}                                  # A-D2: добровольное отклонение доли, доли [Р: Выплаты 2024–2026 годов: 24,4–27,7 % средней прибыли четырёх кварталов]
                                                               #   ось −5…+4 п.п. (доля 0,21–0,30); обратный расчёт −25…+74 п.п. (до доли 100 %)
  excess:
    from_profit_year: 2032                                     # A-D3: выплата избытка — с прибыли 2032 года, после навёрстывания роста [В]
    epsilon: 0.5                                               # доля выплаты избытка над требованием [В: Суждение книги: половина избытка капитала; у компании опоры нет]
                                                               #   платится раз в год — в решении за 4-й квартал прибыли; ось 0–1
    ramp_years: 3                                              # линейный ввод ε за 3 года: ε/3, 2ε/3, ε за прибыль 2032, 2033, 2034 годов [В]
  crisis: {skip_in_shock_year: true, catch_up: false}          # A-D4: решения о дивиденде, принимаемые в год шока, отменяются; догоняющей выплаты нет (в истории компании её не было)
  buyback: {enabled: false}                                    # выключено: выкуп под программу мотивации — в прочих движениях капитала
  calendar:                                                    # A-D5: квартальный календарь (MODEL §5.7) [Ф/В: решения собраний 2024–2026 годов; реестр и выплата — два квартала, 7 из 7]
    frequency: quarterly                                       # решение за каждый квартал прибыли
    decision_lag_quarters: {"1": 2, "2": 2, "3": 1, "4": 2}    # квартал решения = квартал прибыли + лаг: за 1-й — в 3-м, за 2-й и 3-й — в 4-м, за 4-й — во 2-м следующего года;
                                                               #   лаг решения за 3-й квартал — суждение [В]; закрыт ли квартал до якоря, решает факт, а не карта
    reg_deduction_lag_quarters: 2                              # квартал вычета из регуляторного капитала
    payment_lag_quarters: 2                                    # квартал выплаты (обязательство → деньги)
    checkpoints_ahead: 0                                       # проверка достаточности — в самом квартале решения; пробных проходов вперёд нет
    agm_quarter: null                                          # ключи годового календаря в квартальном режиме не читаются
    reg_deduction_quarter: null
    payment_quarter: null
    checkpoints: null

bridge:
  declared_dividends: register                                 # объявленный дивиденд до последнего дня покупки — из реестра (живой вход, MODEL §8.1)
  governance_applies: false                                    # мост не несёт дисконта за управление (MODEL §8.2)

# ------------------------------------------------------------------ ОЦЕНКА (A-V*)
valuation:
  shares_basis: issued                                         # A-V6: делитель «на акцию» — размещённые акции (2 682,7 млн); дивиденд уходит из капитала по акциям в обращении
                                                               #   (2 549,9 млн); центр считает розданными все 132,8 млн собственных акций при обязательствах программы
                                                               #   мотивации 177,3 млн
  share_count_adj: 0.0                                         # поправка делителя, доля [Ф/В: Размещено 2 682,7 млн акций; 132,8 млн собственных — запас программы мотивации]
                                                               #   ось −5…+2 % числа акций
  beta_e: 1.04                                                 # A-V1: β капитала, недели, полная доходность к индексу полной доходности, окно 3 года [Р: Недельная доходность акции против индекса Мосбиржи полной доходности, 3 года]
                                                               #   1,036, ст. ош. 0,046; окна 2 и 5 лет — 1,03 и 1,13; ось 0,95–1,15
  erp: 0.0557                                                  # A-V2: без двойного странового риска [Ф: Премия за риск по Дамодарану на январь 2026 года; решение владельца 30.09.2026]
                                                               #   конвенция семейства моделей; ось 4,9–6,2 %
  roll_along_forwards: true                                    # A-V10: перекат по форвардам (MODEL §0.5)
  governance:                                                  # A-V7: дисконт за управление по каналам снизу вверх; discount = Σ sign·value
    discount: 0.0                                              # Σ каналов, доля V0 печатаемой медианы [Р: Расчёт: по сделкам с акционером, мотивации и листингу потерь сверх книги нет]
                                                               #   пять каналов измерены, каждый — 0: канал без опоры в данных равен нулю; ось 0–10 %; лист evidence/governance
    components:
