# Книга допущений Т-Технологий (850-t) — машинный вид. ЧЕРНОВИК КНИГИ 1.0 (поток «методика», 08.10.2026).
# Схема ключей и источник каждого стартового значения на день написания методики (решения ведущего № 1–5, договор
# ключей и сводка этапа 1 с листами калибровок). Действующие значения книги и ключи, которых здесь нет, — в стоящем
# рядом шаблоне (assumptions_template.yaml) и в docs/MODEL.md, приложение A: при расхождении действует шаблон. Ядро
# оценки этот файл не читает.
# Метки в комментариях:
#   [Ф] — факт с источником; [Р] — расчёт по фактам; [В] — суждение; [О] — описательный ключ (обязателен, умолчания
#   в коде нет); [П] — поведенческий ключ этой панели (без него ядро считает как панель-образец).
#   «уточнит калибровка» — правило выбора числа решено, само число уточняет лист калибровки или счёт ядра.
#   «ВЫВЕДЕНО НА ЯДРЕ» — число зависит от пути баланса клетки: выведено один раз на модальной клетке ядра с
#   включённым ограничением роста и заморожено (MODEL §3.5); у новой версии до вывода — пометка «ВЫВОДИТСЯ НА ЯДРЕ».
#   null — только там, где ядро ключ не читает: под выключателем, в ключе неактивного режима календаря дивидендов;
#   в читаемом пути null — отказ BookError (null ≠ 0).
#   "anchor" — значение выводится из фактов якоря при загрузке книги (формулы — MODEL, приложение A).
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли
# (0,001 = 0,1 п.п.). Всё «на акцию» — после дробления. Траектории — словари {ключ: значение}: "2026Q3" (квартал),
# "2026H2" (полугодие), "2027" (год), LT и LT_from; ключ года якоря действует на оставшиеся кварталы этого года
# (MODEL §0.4). Блоки worlds.N|H|M и worlds_bank в черновик не входят: их пишет build_assumptions.py.

